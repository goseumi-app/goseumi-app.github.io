name: 앱 자동 점검

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'www/**'
      - 'check.mjs'
      - '.github/workflows/test.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 검사용 브라우저 준비
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: 점검 실행 (결과는 이 실행 페이지 맨 위 요약에 표로 뜹니다)
        run: node check.mjs
