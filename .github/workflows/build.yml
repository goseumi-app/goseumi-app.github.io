name: 앱 빌드 (APK + AAB)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    # 홈페이지(랜딩·안내 페이지)만 바뀐 푸시에는 APK를 다시 굽지 않는다 — 앱 파일이 바뀔 때만
    paths:
      - 'www/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'debug-key.b64'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04   # ubuntu-latest는 2026-10-19부터 Ubuntu 26으로 바뀜 — 안드로이드 SDK·도구 구성이 달라져 빌드가 깨지지 않게 고정
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v7

      - name: Java 21 설치
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Node 설치
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: 의존성 설치
        run: npm install

      - name: 서명키 진단 (덮어 설치가 안 됐던 원인 추적용)
        run: |
          echo "HOME=$HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_SDK_HOME=${ANDROID_SDK_HOME:-(미설정)}"
          echo "ANDROID_USER_HOME=${ANDROID_USER_HOME:-(미설정)}"
          echo "--- 러너에 원래 있던 debug.keystore ---"
          ls -la ~/.android/ 2>/dev/null || echo "(없음)"

      - name: 고정 디버그 서명키 심기 (홈 디렉터리 + 프로젝트 양쪽)
        run: |
          mkdir -p ~/.android
          base64 -d debug-key.b64 > ~/.android/debug.keystore
          base64 -d debug-key.b64 > goseumi-debug.jks
          echo "--- 이 저장소에 박혀 있는 서명키 ---"
          keytool -list -v -keystore goseumi-debug.jks -storepass android 2>/dev/null | grep -E "Alias name|SHA256:"

      - name: 안드로이드 프로젝트 생성
        run: |
          npx cap add android
          npx cap sync android

      - name: 위치 권한 선언 — 대략적 위치만 (달빛어린이병원 «가까운 순» — 웹뷰가 위치를 물으려면 필요)
        # 앱은 getCurrentPosition을 enableHighAccuracy:false 로만 부르므로 정밀 위치(ACCESS_FINE_LOCATION)는 필요 없다.
        # Play 위치 권한 정책(2027-01-27 의무화): 꼭 필요한 최소 범위만 — 정밀 위치를 선언하면 «대략적 위치로는 왜 안 되는지»
        # 콘솔 신고가 필요하고, Android 17(API 37+) 타겟부터는 위치 버튼도 의무가 된다. 대략적 위치만 선언하면 둘 다 해당 없음.
        # (2026-11-01 변경 — 그전에는 두 권한을 모두 선언했다)
        run: |
          python3 - <<'PY'
          import io, re
          p='android/app/src/main/AndroidManifest.xml'
          s=io.open(p).read()
          s=re.sub(r'[ \t]*<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"\s*/>\n?', '', s)
          perm='    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n'
          if 'ACCESS_COARSE_LOCATION' not in s:
              a='<uses-permission android:name="android.permission.INTERNET" />'
              if a in s: s=s.replace(a, a+'\n'+perm.rstrip('\n'))
              else: s=s.replace('</manifest>', perm+'</manifest>')
          io.open(p,'w').write(s)
          assert 'ACCESS_FINE_LOCATION' not in s, '정밀 위치 권한이 남아 있음'
          print('\n'.join(l for l in s.split('\n') if 'permission' in l))
          PY
          # Capacitor의 웹뷰 위치 허용 코드는 «둘 다 허용»이 아니면 Android 12 이상에서만 대략적 위치로 넘어간다.
          # 정밀 위치를 선언하지 않으면 시스템이 그 요청을 늘 거부하므로, Android 11 이하에서는 위치가 통째로 막힌다.
          # Android 버전 조건을 빼서 «대략적 위치만 허용돼도 OK»가 모든 버전에서 돌게 한다. 앵커가 없으면(캐패시터가 바뀌면) 빌드를 세운다.
          python3 - <<'PY'
          import io, glob
          c=glob.glob('node_modules/@capacitor/android/capacitor/src/main/java/com/getcapacitor/BridgeWebChromeClient.java')
          assert c, 'BridgeWebChromeClient.java 를 못 찾음'
          p=c[0]; s=io.open(p,encoding='utf-8').read()
          old='Build.VERSION.SDK_INT >= Build.VERSION_CODES.S &&'
          if s.count(old)==1:
              io.open(p,'w',encoding='utf-8').write(s.replace(old,'true /* 대략적 위치만 허용돼도 OK — 모든 Android 버전 */ &&'))
              print('Capacitor 웹뷰 위치 허용: 대략적 위치만 허용돼도 모든 Android 버전에서 통과하게 고침')
          elif '대략적 위치만 허용돼도 OK' in s:
              print('Capacitor 웹뷰 위치 허용: 이미 고쳐져 있음')
          else:
              raise SystemExit('대략적 위치 허용 조건(앵커)을 못 찾음 — 캐패시터 코드가 바뀜. 이 단계를 다시 봐야 함')
          PY

      - name: 서명 설정을 프로젝트에 못박기 + 버전 올리기
        run: |
          cp goseumi-debug.jks android/app/goseumi-debug.jks
          python3 - "${{ github.run_number }}" <<'PY'
          import io, re, sys
          run = sys.argv[1]
          p = 'android/app/build.gradle'
          s = io.open(p, encoding='utf-8').read()
          block = ("\n    signingConfigs {\n"
                   "        debug {\n"
                   "            storeFile file('goseumi-debug.jks')\n"
                   "            storePassword 'android'\n"
                   "            keyAlias 'androiddebugkey'\n"
                   "            keyPassword 'android'\n"
                   "        }\n"
                   "    }\n")
          m = re.search(r'(?m)^android\s*\{', s)
          assert m, 'android block not found'
          s = s[:m.end()] + block + s[m.end():]
          # run_number가 템플릿 기본값(versionCode 1)과 같아도 실패하지 않게 — «바뀌었는지»가 아니라 «있는지»만 확인 (새 저장소 첫 실행 #1이 이걸로 죽었음)
          assert re.search(r'versionCode\s+\d+', s), 'versionCode not found'
          s = re.sub(r'versionCode\s+\d+', 'versionCode ' + run, s, count=1)
          s = re.sub(r'versionName\s+"[^"]*"', 'versionName "1.0.' + run + '"', s, count=1)
          io.open(p, 'w', encoding='utf-8').write(s)
          print(s[:1400])
          PY

      - name: 앱 이름 추출 (결과물 이름에 박아서 눈으로 확인 가능하게)
        run: |
          cat capacitor.config.json
          cat android/app/src/main/res/values/strings.xml
          LABEL=$(grep -o '<string name="app_name">[^<]*' android/app/src/main/res/values/strings.xml | sed 's/.*>//')
          echo "생성된 앱 이름: [$LABEL]"
          echo "APP_LABEL=$LABEL" >> $GITHUB_ENV

      - name: 앱 아이콘 적용
        run: |
          # 2026-09: 러너 이미지에서 ImageMagick이 빠졌다(convert: command not found). 없으면 목록을 갱신하고 설치한다.
          # 실패를 숨기지 않는다 — 조용히 넘어가면 아이콘 없이 굽거나 엉뚱한 곳에서 죽는다.
          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq imagemagick
          fi
          IM=$(command -v magick || command -v convert)
          echo "이미지 도구: $IM"
          convert(){ "$IM" "$@"; }
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            dpi="${d%%:*}"; size="${d##*:}"
            dir="android/app/src/main/res/mipmap-$dpi"
            mkdir -p "$dir"
            convert www/icon-512.png -resize ${size}x${size} "$dir/ic_launcher.png"
            convert www/icon-maskable-512.png -resize ${size}x${size} "$dir/ic_launcher_round.png"
            convert www/icon-maskable-512.png -resize ${size}x${size} "$dir/ic_launcher_foreground.png"
          done

      - name: 테스트용 APK 빌드 (지인 배포용)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 'APK 서명 지문 확인 (이 값이 매번 같아야 덮어 설치가 됩니다)'
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1)
          if [ -n "$SIGNER" ]; then
            APKCERT=$("$SIGNER" verify --print-certs "$APK" | grep -i "SHA-256 digest" | head -1 | awk '{print $NF}')
          else
            APKCERT=$(keytool -printcert -jarfile "$APK" | grep -m1 "SHA256:" | awk '{print $2}' | tr -d ':' | tr 'A-Z' 'a-z')
          fi
          KEYCERT=$(keytool -list -v -keystore goseumi-debug.jks -storepass android 2>/dev/null | grep -m1 "SHA256:" | awk '{print $2}' | tr -d ':' | tr 'A-Z' 'a-z')
          VCODE=$(grep -m1 -oE "versionCode [0-9]+" android/app/build.gradle | awk '{print $2}')
          VNAME=$(grep -m1 -oE 'versionName "[^"]*"' android/app/build.gradle | cut -d'"' -f2)
          echo "APK 서명 : $APKCERT"
          echo "저장소 키: $KEYCERT"
          {
            echo "## 이 APK의 신원"
            echo ""
            echo "| | 값 |"
            echo "|---|---|"
            echo "| 앱 버전 | \`$VNAME\` (versionCode $VCODE) |"
            echo "| **APK 서명 지문 (SHA-256)** | \`$APKCERT\` |"
            echo "| 저장소에 박아둔 서명키 | \`$KEYCERT\` |"
            echo ""
            if [ "$APKCERT" = "$KEYCERT" ]; then
              echo "✅ **서명이 고정 키와 일치합니다.** 이 지문이 매번 같으면 기존 앱 위에 덮어 설치됩니다 (기록 유지)."
            else
              echo "❌ **서명이 고정 키와 다릅니다.** 이대로면 덮어 설치가 안 됩니다."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$APKCERT" != "$KEYCERT" ]; then echo "::warning::APK 서명이 고정 키와 다릅니다 — 덮어 설치가 안 될 수 있습니다"; fi

      - name: APK 업로드
        uses: actions/upload-artifact@v7
        with:
          name: 설치파일-APK-앱이름은-${{ env.APP_LABEL }}
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: 스토어용 AAB 빌드 (서명키 등록된 경우만)
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload.jks
          cd android
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$PWD/app/upload.jks \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias=siwoo \
            -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD"

      - name: AAB 업로드
        if: ${{ env.KEYSTORE_B64 != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: 스토어용-AAB-앱이름은-${{ env.APP_LABEL }}
          path: android/app/build/outputs/bundle/release/app-release.aab
