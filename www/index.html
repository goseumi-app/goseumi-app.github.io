<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>고슴이 — 놀이와 이유식 육아기록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#FBF3E7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#FBF3E7; --card:#FFFFFF; --ink:#4A392E; --sub:#6B5248; --line:#F2E3CF;
  --ctext:#B33A19;   /* 글자로 쓰는 코랄 — 원래 코랄은 흰 배경에서 대비 3.9라 작은 글자엔 부족했다 */
  --peach:#FFC79E; --peach2:#FFB38A; --coral:#D95632; --mint:#C4E7D2; --mint2:#9BD8B6;
  --sky:#C4DEF2; --butter:#FFE9B3; --pink:#FBD3D0; --lav:#E3D9F2;
  --clay:0 5px 0 rgba(190,148,104,.28), 0 10px 24px rgba(190,148,104,.16);
  --clay-s:0 3px 0 rgba(190,148,104,.22), 0 6px 14px rgba(190,148,104,.12);
  --r:22px; --ok:#2F7A4C;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#231C14; --card:#2F261C; --ink:#F6EADB; --sub:#BCA793; --line:#413524;
    --coral:#FF9A76; --ctext:#FF9A76; --ok:#7CCB9C;
    --clay:0 5px 0 rgba(0,0,0,.4), 0 10px 24px rgba(0,0,0,.3);
    --clay-s:0 3px 0 rgba(0,0,0,.35), 0 6px 14px rgba(0,0,0,.25);
  }
}
/* 🌙 밤중 모드 — 잠든 아기 옆에서 켤 수 있게 저휘도 적색 계열 (베이비엔젤이 검증한 패턴) */
/* 색을 이미 어둡게 «구워서» 넣는다.
   예전엔 body에 filter를 걸어 어둡게 했는데, filter가 걸린 요소는 position:fixed 자식의 기준이 돼버려서
   밤중 모드에서만 하단 탭이 화면에 안 붙고 문서 맨 아래로 밀려났다. 그래서 filter를 걷어냈다. */
body.night{ --bg:#100B08; --card:#19110E; --ink:#C5AC93; --sub:#A88970; --line:#2A1E17;
  --peach:#714E36; --peach2:#63442E; --coral:#A36B4C; --ctext:#C79070; --mint:#3A4B3B; --mint2:#455946;
  --sky:#353E46; --butter:#4B3F25; --pink:#493029; --lav:#3B3342; --ok:#688970;
  --clay:0 4px 0 rgba(0,0,0,.5); --clay-s:0 2px 0 rgba(0,0,0,.45); }
body.night img,body.night svg{filter:brightness(.72) sepia(.18)}
/* 배경만 어두워지고 글자색은 낮 시절 그대로라 «칩·배지·안내상자»가 안 보였다 — 글자색도 같이 뒤집는다 */
body.night .chip.c1,body.night .chip.c2,body.night .chip.c3,
body.night .chip.c4,body.night .chip.c5,body.night .chip.c6,
body.night .badge.ok,body.night .badge.al,body.night .badge.watch,body.night .badge.warn,
body.night .notice,body.night .notice.warm,body.night .notice.mint,
body.night .condbtn.on,body.night .stChip.ok,body.night .stChip.tmp{color:#E4C8AE}
body.night button.pri,body.night button.sec,body.night a.pri,body.night a.sec{color:#F0D9C2 !important}
body.night .notice .small,body.night .notice span{color:inherit}
body.night .mathbox{border-color:#6B5A80}
body.night .mathbox .tt{color:#C3ADE0}
.erhd{color:#8A3A30}
body.night .erhd{color:#E89A8A}
@media (prefers-color-scheme: dark){ .erhd{color:#FF9A88} }
/* v25: 홈 상태 타일 — 수면·이유식·접종을 한 줄로 (컴팩트 피드백) */
.tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.tile{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 8px;
  font-family:inherit;text-align:center;cursor:pointer;box-shadow:var(--clay-s);color:var(--ink)}
.tile .e{font-size:19px;display:block;margin-bottom:2px}
.tile .v{font-size:13.5px;font-weight:800;display:block;line-height:1.35;color:var(--ink)}
.tile .k{font-size:11.5px;font-weight:700;color:var(--sub);display:block;margin-top:1px}
/* v25: 미니 그래프(수면 7일·놀이 주간) — 라이브러리 없이 그린다: 오프라인·용량 원칙 */
.g7{display:flex;align-items:flex-end;gap:6px;height:96px;margin:8px 0 2px}
.g7 .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%;gap:2px}
.g7 .seg{border-radius:6px 6px 3px 3px;min-height:0}
.g7 .seg.n8{background:var(--lav)}
.g7 .seg.nap{background:var(--sky)}
.g7lab{display:flex;gap:6px}
.g7lab span{flex:1;text-align:center;font-size:11px;font-weight:700;color:var(--sub);line-height:1.4}
.wkbar{display:flex;align-items:center;gap:8px;margin:5px 0}
.wkbar .wl{width:112px;font-size:12.5px;font-weight:700;white-space:nowrap}
.wkbar .wt{flex:1;background:var(--bg);border-radius:999px;height:14px;overflow:hidden}
.wkbar .wf{height:100%;border-radius:999px;background:var(--mint2);min-width:2px}
.wkbar .wv{width:30px;text-align:right;font-size:12.5px;font-weight:800;color:var(--sub)}
@keyframes pop{0%{transform:scale(.8)}55%{transform:scale(1.12)}100%{transform:scale(1)}}
.justdone{animation:pop .35s ease-out}
button.sec:active,button.pri:active,.tile:active{transform:scale(.97)}
@media (prefers-reduced-motion: reduce){ .justdone{animation:none} button.sec:active,button.pri:active,.tile:active{transform:none} }
/* 근거 등급 배지 — 이 앱의 성격 */
.evb{display:inline-block;font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:999px;
  margin-left:5px;vertical-align:middle;cursor:pointer;letter-spacing:.3px;line-height:1.6}
.gchart{width:100%;height:auto;display:block;touch-action:pan-y}
.qbtn{border:none;border-radius:16px;padding:11px 8px;font-family:inherit;font-weight:800;font-size:13px;
  cursor:pointer;background:var(--card);color:var(--ink);box-shadow:var(--clay-s);
  display:flex;flex-direction:column;align-items:center;gap:3px;line-height:1.25}
.qbtn .e{font-size:19px}
.qbtn:active{transform:translateY(2px);box-shadow:none}
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.sleepbar{height:22px;border-radius:8px;background:var(--line);position:relative;overflow:hidden}
.sleepbar>i{position:absolute;top:0;bottom:0;background:var(--sky);opacity:.95}
.sleepbar>i.nap{background:var(--butter)}
.bandwrap{position:relative;height:30px;border-radius:10px;background:var(--line);overflow:hidden;margin:6px 0}
.bandwrap>.band{position:absolute;top:0;bottom:0;background:var(--mint);opacity:.55}
.bandwrap>.mk{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--coral);border-radius:2px}

/* 접근성 — 모션 민감 사용자 존중 (WCAG 2.3.3) */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important;scroll-behavior:auto !important}
  .mascot.b{animation:none !important}
}
/* 키보드 포커스 — 없애지 않고 또렷하게 */
:focus-visible{outline:3px solid var(--coral);outline-offset:2px;border-radius:8px}
/* 작은 글씨 하한 */
.small{font-size:13.5px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:'Nunito',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  font-size:16px;line-height:1.72}
.hd,h1,h2{font-family:'Jua','Nunito',-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-weight:400;letter-spacing:.2px}
#app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
main{flex:1;padding:12px 14px calc(92px + env(safe-area-inset-bottom, 0px))}
/* 아이폰 노치·다이내믹 아일랜드와 홈 인디케이터를 피한다.
   홈 화면에 추가해서 전체화면으로 열면 페이지가 화면 맨 위(0,0)부터 시작하기 때문에
   safe-area 만큼 스스로 비켜주지 않으면 제목이 시계·배터리에 가린다. */
header.top{position:sticky;top:0;z-index:20;background:var(--bg);
  padding:calc(12px + env(safe-area-inset-top, 0px)) 16px 8px;
  display:flex;align-items:center;justify-content:space-between}
header.top .t{font-size:20px}
header.top .sub{font-size:12.5px;color:var(--sub);font-weight:700}
.gear{background:var(--card);border:2px solid var(--line);border-radius:14px;width:44px;height:44px;
  cursor:pointer;color:var(--sub);display:flex;align-items:center;justify-content:center;box-shadow:var(--clay-s)}
nav.bottom{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom, 0px));left:50%;transform:translateX(-50%);z-index:20;background:var(--card);
  border:2px solid var(--line);display:flex;width:min(452px,calc(100% - 24px));
  border-radius:24px;box-shadow:var(--clay);padding:4px}
nav.bottom button{flex:1;background:none;border:none;padding:8px 0 6px;cursor:pointer;
  color:var(--sub);font-size:10.5px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-family:inherit;border-radius:18px;transition:background .18s}
nav.bottom button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
nav.bottom button.on{color:var(--ctext,var(--coral));background:var(--bg)}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);
  padding:13px 14px;margin-bottom:10px;box-shadow:var(--clay-s)}
.card.pop{box-shadow:var(--clay)}
.chip{display:inline-block;background:var(--bg);border-radius:999px;padding:3px 11px;
  font-size:12.5px;color:var(--sub);margin:0 6px 6px 0;font-weight:800}
.chip.c1{background:var(--peach);color:#5A3A22}
.chip.c2{background:var(--mint);color:#2A5940}
.chip.c3{background:var(--sky);color:#2C4A66}
.chip.c4{background:var(--butter);color:#6B5518}
.chip.c5{background:var(--pink);color:#7A3A36}
.chip.c6{background:var(--lav);color:#4C3B6E}
h2{font-size:17px;margin:0 0 8px}
h3{font-size:13.5px;margin:12px 0 5px;color:var(--sub);font-weight:800;font-family:'Nunito',sans-serif}
.big{font-size:19px;margin:2px 0 6px}
.sub{color:var(--sub);font-size:14px}
.small{font-size:13.5px;color:var(--sub);line-height:1.65}
button.pri,button.sec,a.pri,a.sec{width:100%;border:none;border-radius:18px;padding:12px 14px;font-size:15.5px;
  font-weight:800;cursor:pointer;font-family:inherit;color:#5A3A22;transition:transform .12s, box-shadow .12s}
button.pri,a.pri{background:var(--peach);box-shadow:0 4px 0 rgba(190,120,70,.45)}
button.sec,a.sec{background:var(--butter);box-shadow:0 4px 0 rgba(190,150,60,.35)}
a.pri,a.sec{display:block;box-sizing:border-box}
a.pri .small,a.sec .small,button.pri .small,button.sec .small{color:inherit}
button.pri:active,button.sec:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(190,120,70,.45)}
button.ghost{background:none;border:none;color:var(--ctext,var(--coral));font-size:14px;cursor:pointer;min-height:44px;
  padding:8px 0;font-family:inherit;font-weight:800}
.row{display:flex;gap:10px}.row>*{flex:1}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2.5px solid var(--line);
  border-radius:18px;padding:13px 14px;margin-bottom:10px;font-size:15px;cursor:pointer;
  font-family:inherit;color:var(--ink);font-weight:700;transition:border-color .15s}
.opt .d{display:block;font-size:13px;color:var(--sub);margin-top:2px;font-weight:600}
.opt.on{border-color:var(--coral);background:var(--bg)}
input,textarea,select{width:100%;background:var(--card);color:var(--ink);
  border:2px solid var(--line);border-radius:14px;padding:11px 12px;font-size:15px;font-family:inherit}
textarea{min-height:72px;resize:vertical}
label.f{display:block;font-size:13.5px;color:var(--sub);margin:13px 0 5px;font-weight:800}
.notice{background:var(--sky);color:#2C4A66;border-radius:16px;padding:12px 14px;font-size:14px;margin:10px 0;font-weight:600;line-height:1.7}
.notice.warm{background:var(--pink);color:#7A3A36}
.notice.mint{background:var(--mint);color:#2A5940}
@media (prefers-color-scheme: dark){
  .notice{background:#2C3E52;color:#CBE0F2}.notice.warm{background:#4A2E2C;color:#F2CBc7}.notice.mint{background:#2A4436;color:#C6E8D4}
  .chip.c1{background:#5A3A22;color:#FFC79E}.chip.c2{background:#2A5940;color:#C4E7D2}.chip.c3{background:#2C4A66;color:#C4DEF2}
  .chip.c4{background:#6B5518;color:#FFE9B3}.chip.c5{background:#7A3A36;color:#FBD3D0}.chip.c6{background:#4C3B6E;color:#E3D9F2}
  button.pri{color:#5A3A22}button.sec{color:#6B5518}
}
.divider{height:2px;background:var(--line);margin:14px 0;border-radius:2px}
.playline{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pnum{color:var(--sub);font-size:13.5px;font-weight:800}
.bar-row{display:flex;align-items:center;gap:10px;margin:7px 0}
.bar-row .lab{width:100px;font-size:13.5px;font-weight:700}
.bar-row .track{flex:1;height:16px;background:var(--bg);border-radius:8px;overflow:hidden;border:1.5px solid var(--line)}
.bar-row .fill{height:100%;background:var(--peach2);border-radius:8px;min-width:3px}
.bar-row .val{width:44px;text-align:right;font-size:13px;color:var(--sub);font-weight:700}
.emobtn{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--card);
  border:2.5px solid var(--line);border-radius:18px;padding:12px 4px;cursor:pointer;flex:1;
  font-family:inherit;color:var(--ink);font-size:11.5px;font-weight:800}
.emobtn .e{font-size:26px}
.emobtn.on{border-color:var(--coral);background:var(--bg)}
.condbtn{background:var(--card);border:2px solid var(--line);border-radius:999px;
  padding:7px 13px;font-size:13.5px;cursor:pointer;font-family:inherit;color:var(--ink);margin:0 6px 8px 0;font-weight:700}
.condbtn.on{border-color:var(--coral);background:var(--pink);color:#7A3A36}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:13px}
.cal .h{color:var(--sub);font-size:11px;padding:4px 0;font-weight:800}
.cal .d{padding:8px 0;border-radius:12px;cursor:pointer;position:relative;font-weight:700}
.cal .d.dot::after{content:"";position:absolute;bottom:3px;left:50%;transform:translateX(-50%);
  width:5px;height:5px;border-radius:50%;background:var(--coral)}
.cal .d.sel{background:var(--peach);color:#5A3A22}
.cal .d.today{outline:2.5px solid var(--peach2)}
.logitem{border-left:4px solid var(--peach2);padding:6px 0 6px 12px;margin:10px 0;border-radius:2px}
.logitem .dt{font-size:12px;color:var(--sub);font-weight:800}
.mile{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:2px solid var(--line);cursor:pointer}
.mile:last-child{border-bottom:none}
.mile .nm{font-size:14.5px;font-weight:700}
.mile .st{font-size:12.5px;color:var(--sub);font-weight:700}
.mathbox{background:linear-gradient(135deg,var(--lav),transparent);border:2px dashed #B49CD9;
  border-radius:18px;padding:13px 14px;margin:12px 0;font-size:14px}
.mathbox .tt{font-weight:800;color:#7A5FA8;font-size:13px;margin-bottom:6px}
@media (prefers-color-scheme: dark){ .mathbox{background:linear-gradient(135deg,#3A2F52,transparent)} .mathbox .tt{color:#C9B4EC} }
.srcbox{background:var(--bg);border-radius:16px;padding:10px 12px;font-size:12.5px;color:var(--sub);margin-top:12px;font-weight:600}
.bubble{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;
  padding:12px 14px;font-size:14.5px;box-shadow:var(--clay-s);font-weight:700}
.bubble::before{content:"";position:absolute;left:-9px;top:18px;width:14px;height:14px;background:var(--card);
  border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.hero{display:flex;gap:12px;align-items:flex-start;margin:6px 0 16px}
.hero .mascot{flex:0 0 74px}
.fade{animation:fd .3s ease}
@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.mascot.b{animation:bounce 2.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){ .mascot.b{animation:none} .fade{animation:none} }
.hidden{display:none!important}
#printArea{display:none}
/* 인쇄 — 진료실에 들고 가는 종이.
   폰이 다크 모드거나 밤중 모드면 화면 색이 그대로 인쇄돼 «검은 종이»가 나온다.
   그래서 인쇄할 때는 테마를 무시하고 흰 종이·검은 글씨로 못박는다. */
@media print{
  :root, body.night{ --bg:#fff; --card:#fff; --ink:#000; --sub:#333; --line:#999;
    --peach:#fff; --peach2:#fff; --mint:#fff; --sky:#fff; --butter:#fff; --pink:#fff; --lav:#fff;
    --coral:#000; --ctext:#000; --ok:#000; --clay:none; --clay-s:none; }
  html,body{background:#fff !important;color:#000 !important;zoom:1 !important}
  body.night{filter:none !important}
  #app{display:none}
  #printArea{display:block;font-size:12px;color:#000;background:#fff}
  #printArea *{color:#000 !important;background:#fff !important;box-shadow:none !important}
  #printArea h1{font-size:18px}#printArea h2{font-size:14px;margin:14px 0 4px}
  #printArea table{width:100%;border-collapse:collapse}
  #printArea td,#printArea th{border:1px solid #999 !important;padding:4px 6px;text-align:left;font-size:11px}
  #printArea tr,#printArea table{page-break-inside:avoid}
  @page{ margin:14mm }
}
.stChip{font-size:12px;border-radius:999px;padding:3px 10px;font-weight:800}
.stChip.ok{background:var(--mint);color:#2A5940}
.stChip.tmp{background:var(--pink);color:#7A3A36}
.footer-note{font-size:12px;color:var(--sub);text-align:center;margin:18px 4px 6px;line-height:1.7;font-weight:600}
.foodItem{display:flex;align-items:center;gap:9px;padding:10px 4px;border-bottom:2px solid var(--line);cursor:pointer}
.foodItem:last-child{border-bottom:none}
.foodItem .nm{font-weight:800;font-size:15px}
.foodItem .tag{margin-left:auto;display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.badge{font-size:11px;border-radius:999px;padding:2px 9px;font-weight:800}
.badge.ok{background:var(--mint);color:#2A5940}
.badge.al{background:var(--butter);color:#6B5518}
.badge.watch{background:var(--sky);color:#2C4A66}
.badge.warn{background:var(--pink);color:#7A3A36}
.mealcell{border:2px solid var(--line);border-radius:14px;padding:8px 10px;margin:6px 0;font-size:13.5px;cursor:pointer;font-weight:700}
.mealcell .mt{font-size:11px;color:var(--sub);font-weight:800}
.shopbtn{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);
  border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer;font-family:inherit;color:var(--ink);font-weight:800;box-shadow:var(--clay-s)}
.dday{display:flex;align-items:center;gap:10px}
.dday .n{font-family:'Jua';font-size:26px;color:var(--coral)}
a{color:var(--coral)}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px;border-radius:8px}
/* 예방접종 체크리스트 */
.vaxrow{display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:2px solid var(--line);cursor:pointer}
.vaxrow:last-child{border-bottom:0}
.vaxbox{flex:0 0 25px;height:25px;border-radius:8px;border:2.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:#fff;background:var(--card)}
.vaxrow.on .vaxbox{background:var(--ok);border-color:var(--ok)}
.vaxnm{flex:1;font-size:13.5px;font-weight:700;line-height:1.35}
.vaxw{color:var(--sub);font-weight:600;font-size:12.5px}
.vaxdt{font-size:11.5px;font-weight:800;color:var(--sub);white-space:nowrap;padding:4px 8px;border-radius:10px;background:var(--bg)}
.vaxrow.on .vaxnm{opacity:.72}
.vaxg{margin-bottom:10px}
.vaxg>summary{font-weight:800;cursor:pointer;font-size:15px;padding:4px 0;list-style:none;display:flex;align-items:center;gap:7px}
.vaxg>summary::-webkit-details-marker{display:none}
.vaxg>summary::before{content:"▸";color:var(--sub);font-size:13px}
.vaxg[open]>summary::before{content:"▾"}
.vaxcnt{margin-left:auto;font-size:11.5px;font-weight:800;color:var(--sub)}
</style>
</head>

math": 1, "label": "[CDC 9개월] 「손가락으로 물건을 집는다」 방향 · 10명 중 7~8명 이상", "mat": "녹두·쌀 등 마른 알갱이, 넓은 쟁반, 컵 두 개", "how": "쟁반에 알갱이를 얇게 펴 놓는다. **손으로 그러모으고 흩뿌리게** 둔다. 컵에 옮겨 담아도 좋다.", "down": "알갱이 대신 큰 콩이나 파스타로. 양을 적게.", "up": "컵에서 컵으로 옮기기. «많다/적다»를 말해준다.", "warn": "⚠️ **질식 위험이 가장 큰 놀이입니다.** 반드시 팔 닿는 거리에서, 눈을 떼지 말고, 아기가 입에 넣으려 하면 즉시 중단하세요. 콩·견과류는 4세까지 질식 사고 대표 품목입니다(AAP). 걱정되면 이 놀이는 건너뛰어도 됩니다.", "src": [233], "srcRaw": "D233 — 문화센터 녹두 매트에서 앉은 채로 녹두를 그러모아 쥐고, 손을 펴서 흩뿌리듯 던졌습니다.", "mathEye": {"seed": "연속량 · 셀 수 없는 것", "now": "한 알씩 셀 수 없는 «덩어리»를 다루는 중입니다.", "later": "블록은 셀 수 있고 모래는 못 셉니다. 이산량과 연속량의 차이 — 나중에 정수와 실수로 갈라지는 지점입니다.", "watch": "한 알을 집는지, 한 움큼을 쥐는지 보세요. 둘은 다른 동작입니다."}, "n": 71}, {"name": "통에 넣기 (안과 밖)", "m": 8, "dom": "인지", "dom2": "신체", "math": 1, "label": "[CDC 9개월] 「물건을 서로 부딪친다」 인접 · 10명 중 7~8명 이상", "mat": "입구가 넓은 통, 작은 공이나 블록 3~4개", "how": "통 옆에 공을 흩어 놓는다. 하나씩 넣는 걸 **한 번 보여준 뒤 기다린다.** «안», «밖»을 말해준다.", "down": "통을 더 크고 낮은 것으로. 또는 빼기부터 시켜본다 (넣기보다 빼기가 먼저입니다).", "up": "입구가 좁은 통으로. 넣을 때마다 «하나, 둘» 세어준다.", "warn": "**정확히 못 넣는 게 정상입니다.** D226 기록: «큰 통 입구로 정확히 조준하여 떨어뜨리는 위치 정밀 조작에는 다소 미숙함». 조준은 아직 어려운 과제입니다. 통 옆에 떨어뜨려도 «넣으려 한 것»입니다.", "src": [226, 217, 206], "srcRaw": "D226 — 공을 손가락 끝으로 쥐는 건 되지만 통 입구 조준은 미숙했습니다. D217·D206 — 통에 넣고 빼는 놀이와 수 세기 리듬에 시선을 맞췄습니다.", "mathEye": {"seed": "위상 · 안과 밖", "now": "«통 안»과 «통 밖»이 다른 곳이라는 걸 익히는 중입니다.", "later": "위상수학이 다루는 가장 기본 개념입니다. 모양이 찌그러져도 «안»은 «안»입니다.", "watch": "넣는 것보다 **빼는 걸 먼저** 합니다. 순서가 거꾸로가 아니라 원래 그렇습니다."}, "n": 72}, {"name": "돌리고 멈추기", "m": 8, "dom": "인지", "dom2": "신체", "math": 1, "label": "[CDC 9개월] 「원인과 결과를 안다」 방향 · 10명 중 7~8명 이상", "mat": "회전 스피너, 팽이, 또는 굴러가는 바퀴 장난감", "how": "스피너를 돌려준다. 아기가 **돌리는지, 그리고 멈추는지** 본다. 멈추면 «멈췄네» 하고 말해준다.", "down": "천천히 돌려 오래 보게 한다.", "up": "«돌려볼까?» «멈춰볼까?» 를 번갈아 청한다.", "warn": "**멈추는 게 더 어려운 일입니다.** 돌리는 건 힘을 쓰면 되지만, 멈추는 건 하려던 동작을 참는 것이라 뇌가 다른 일을 합니다. 멈추는 걸 봤다면 그날은 그것만 봐도 충분합니다.", "src": [222, 211], "srcRaw": "D222 — 앉은 자세로 스피너를 쳐서 돌린 뒤, 회전 중인 날개를 손바닥으로 눌러 정지시켰습니다. D211 — 완구가 완전히 멈출 때까지 기다린 뒤 다시 조작했습니다.", "mathEye": {"seed": "주기 · 감쇠", "now": "돌던 것이 저절로 느려지다 멈추는 걸 보는 중입니다.", "later": "가만히 두면 멈춘다 — 마찰의 경험입니다. 그리고 «돌린다/멈춘다»는 서로 반대되는 연산의 첫 짝입니다.", "watch": "멈추기를 «일부러» 하는지 보세요. 그렇다면 참는 힘이 생긴 것입니다."}, "n": 73}, {"name": "이름 부르고 기다리기", "m": 8, "dom": "언어", "dom2": "사회정서", "math": 0, "label": "[CDC 9개월] 「이름을 부르면 쳐다본다」 · 10명 중 7~8명 이상", "mat": "없음", "how": "아기가 **다른 데 집중하고 있을 때** 이름을 한 번 부른다. 그리고 **3초 기다린다.** 반응이 없으면 한 번 더. 그게 끝이다.", "down": "이름 앞에 «까꿍» 같은 소리를 붙여 주의를 먼저 끈다.", "up": "다른 방향에서 불러 본다. 소리 나는 쪽을 찾는지 함께 본다.", "warn": "**연달아 여러 번 부르지 마십시오.** 그러면 이름이 «소음»이 되어 오히려 반응이 줄어듭니다. 한 번 부르고 기다리기 — 이름에 돌아보는지는 영유아건강검진에서도 함께 보는 주제입니다.", "src": [220, 215], "srcRaw": "D220 — 잼잼과 손 흔들기를 모방했습니다. D215 — 「음 빠」 소리를 냈습니다(양순음 조음 연습).", "n": 74}, {"name": "잡고 일어서서 놀기", "m": 8, "dom": "신체", "dom2": null, "math": 0, "label": "[WHO] 붙잡고 서기 — **중앙값 7.4개월 · 정상 범위 4.8~11.4개월**", "mat": "걸음마 완구, 낮은 원목 상자, 또는 소파 모서리 — **밀리지 않는 것**", "how": "잡을 것을 아기 앞에 둔다. 그 위에 좋아하는 장난감을 올려놓는다. **일어서라고 시키지 않는다** — 올라오고 싶게 만들 뿐이다.", "down": "잡을 것을 더 낮은 것(쿠션 위 상자 등)으로 바꾼다. 무릎 서기까지만 해도 충분하다.", "up": "장난감을 잡을 것의 **끝 쪽**에 둔다. 잡은 채 옆으로 발을 떼는지 본다.", "warn": "**잡을 것이 밀리면 그대로 앞으로 넘어집니다.** 걸음마 완구는 바퀴를 잠그거나 벽에 대고, 뒤로 주저앉을 자리에 딱딱한 것을 치워두세요. 그리고 «일어섰다가 못 앉아서 우는 것»은 흔한 일입니다 — 내려오는 법(엉덩이부터)은 나중에 배웁니다.", "src": [240, 242, 239], "srcRaw": "D240 — 엄마와 걸음마 장난감을 잡고 일어섰습니다. D242 — 스스로 완구를 잡고 두 발로 일어서며 웃었습니다. D239 — 누운 아빠의 배를 디디고 서는 자세를 유지했습니다. 기록에는 «시야 변화를 즐긴 것일 수 있으나, 발바닥의 푹신한 감촉에 반응해 발을 구른 것일 가능성»도 함께 적혀 있습니다.", "mathEye": {"seed": "수직 · 지지점", "now": "기대는 곳(지지점)이 있어야 몸을 세울 수 있다는 걸 몸으로 재는 중입니다.", "later": "바닥·손잡이·몸의 세 점이 만드는 균형 — 나중에 «세모가 튼튼한 이유»를 몸이 먼저 압니다.", "watch": "일어선 뒤 한 손을 떼는 순간이 오는지 보세요. 지지점 하나를 스스로 줄여보는 실험입니다."}, "n": 75}, {"name": "문 너머 까꿍", "m": 8, "dom": "인지", "dom2": "사회정서", "math": 1, "label": "[CDC 9개월] 「까꿍 놀이를 좋아한다」 · 10명 중 7~8명 이상", "mat": "열린 문, 문틀, 또는 소파 등받이 — 몸을 숨길 수 있는 큰 것", "how": "문 뒤에 숨고 **목소리만** 들려준다. 아기 이름을 한 번 부른다. 아기가 문 쪽을 보거나 다가오면 얼굴을 내밀며 «까꿍».", "down": "몸을 반쯤 보이게 숨는다. 찾는 게 아니라 «나타나는 것»을 즐기게 한다.", "up": "목소리 없이 숨는다. 조용해진 것만으로 문 쪽을 보는지 관찰한다.", "warn": "**문 놀이는 손끼임이 제일 무섭습니다.** 문은 활짝 열어 고정하고, 경첩 쪽에 아기 손이 가지 않는지 보세요. 못 찾고 다른 놀이로 가버려도 그날은 그걸로 끝 — 쫓아가서 다시 시키지 않습니다.", "src": [244, 245], "srcRaw": "D244 — 자다 깨어 문 방향으로 기어가 그물망 너머를 내다봤습니다. 기록에는 «누군가를 찾으려 했다기보다 문틈의 빛이나 소리 쪽으로 고개를 돌려 기어간 것일 가능성»도 적혀 있습니다. D245 — 문 뒤 까꿍 부르기에 문 쪽을 보며 반응했습니다.", "mathEye": {"seed": "보이지 않아도 있다", "now": "벽 너머에 사람이 «계속 있다»는 감을 잡는 중입니다.", "later": "눈에 안 보여도 값이 사라지지 않는다 — 가려진 수를 다루는 힘의 먼 출발점입니다.", "watch": "목소리가 난 문 쪽을 «미리» 보는지 — 나타날 자리를 예측하는지 보세요."}, "n": 76}, {"name": "맞부딪쳐 보여주기", "m": 8, "dom": "신체", "dom2": "인지", "math": 0, "label": "[CDC 9개월] 「물건 두 개를 맞부딪친다」 · 10명 중 7~8명 이상", "mat": "한 손에 잡히는 블록·컵 두 개 (같은 것 두 개가 좋다)", "how": "아기 두 손에 하나씩 쥐여준다. 부모가 자기 블록 두 개를 **눈앞에서 딱딱 부딪쳐 보여주고** 기다린다. 그게 전부다.", "down": "블록 대신 소리가 잘 나는 컵이나 뚜껑으로 바꿔 «소리»가 보상이 되게 한다.", "up": "리듬을 바꿔 두 번-쉬고-두 번 부딪쳐 본다. 리듬이 달라진 걸 아는 눈치인지 본다.", "warn": "**안 따라 해도 그만입니다.** 이 집 기록에도 블록을 잠시 만지다 다른 데로 가버린 날이 그대로 적혀 있습니다 — «손이 서툴러서라기보다 주변에 더 흥미로운 것이 많았기 때문일 수 있다»고요. 시연은 하루 한 번이면 충분하고, 아기 손을 잡아 억지로 부딪치게 하지 않습니다.", "src": [243], "srcRaw": "D243 — 아빠가 원목 블록 두 개를 마주쳐 두드려 보여줬습니다. 아기는 블록을 손으로 잠시 만지다가 놓고 주변의 다른 물건으로 시선을 옮겼습니다.", "n": 77}, {"n": 78, "name": "떼어서 옮겨 붙이기", "m": 8, "dom": "신체", "dom2": "인지", "math": 1, "label": "[CDC 12개월] 「컵 안에 블록을 넣듯이 용기에 무엇인가를 넣는다」의 전 단계 · 10명 중 7~8명 이상", "mat": "부직포(찍찍이)로 붙였다 떼는 놀이책 — 없으면 마스킹 테이프를 붙여둔 종이", "how": "조각 하나를 아기 손이 닿는 자리에 붙여둔다. **떼어내는 것까지만 보고 기다린다.** 어디로 가져갈지는 아기가 정한다.", "down": "떼기가 어려우면 한쪽 귀퉁이를 미리 들어둔다. **떼어진다는 걸 손으로 아는 게** 먼저다.", "up": "붙일 자리를 두 곳 만들어 둔다. 어느 쪽으로 가져가는지, **쥐었을 때 시선이 먼저 그쪽을 향하는지** 본다.", "warn": "**겉으로는 같아 보입니다.** 조각을 쥔 손이 우연히 그림 위에 닿은 것과, 거기 놓으려고 가져간 것은 구별이 안 됩니다. 이 집 기록에도 「우연히 카트 위에 손이 닿았을 가능성」이 그대로 적혀 있습니다. 둘을 가르는 단 하나는 **쥐었을 때 시선이 먼저 목적지를 향하는가**입니다. 찍찍이 조각은 삼킬 수 있는 크기이니 눈을 떼지 마세요.", "src": [246], "srcRaw": "D246 — 부직포 조각을 떼어 손에 쥔 채 카트 그림 쪽으로 가져다 댔습니다. 기록에는 「우연히 손이 닿았을 가능성」과 그 둘을 구분하는 방법이 함께 적혀 있습니다.", "mathEye": {"seed": "위치 이동 · 통제변인", "now": "물건을 잡아서 «다른 자리»로 옮기려 합니다.", "later" function pctFromZ(z){
  if(z<-6)return 0.1; if(z>6)return 99.9;
  const t=1/(1+0.2316419*Math.abs(z)), d=0.3989423*Math.exp(-z*z/2);
  let p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));
  p = z>0 ? 1-p : p;
  return Math.max(0.1,Math.min(99.9,p*100));
}
function lmsAt(key,m){
  const tb=WHO_LMS[key]; if(!tb)return null;
  const mm=Math.max(0,Math.min(24,m));
  const lo=Math.floor(mm), hi=Math.min(24,lo+1), f=mm-lo;
  const a=tb[lo], b=tb[hi]||tb[lo];
  return [a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f];
}
function valueAtZ(key,m,z){
  const p=lmsAt(key,m); if(!p)return null;
  const [L,M,S]=p;
  return L===0 ? M*Math.exp(S*z) : M*Math.pow(1+L*S*z, 1/L);
}

  if(!child)return 0;
  /* 달력으로 센 «만 개월». 30.44일로 나누면 생후 6개월 되는 날에도 5개월로 나온다 —

  let m=(n.getFullYear()-b.getFullYear())*12+(n.getMonth()-b.getMonth());

}

function suggestToday(){
  /* v24: 영역별 1개씩 — 고루 발달하도록. 관심 영역이 있으면 맨 앞에 세운다 */
  const t=todayStr();
  const cached=sugCache[t];
  if(cached&&!Array.isArray(cached)&&cached.v===2)return cached.l;   /* 옛 2개짜리 캐시는 무시하고 새로 뽑는다 */
  const m=Math.min(monthAge(),MAX_PLAY_M);
  let pool=PLAYS.filter(p=>p.m===m||p.m===Math.max(0,m-1));
  if(!pool.length)pool=PLAYS.filter(p=>p.m>=6);
  const recent=new Set();
  Object.keys(sugCache).forEach(d=>{ if(daysBetween(d,t)<=2&&daysBetween(d,t)>=0){
    const v=sugCache[d]; (Array.isArray(v)?v:(v&&v.l)||[]).forEach(n=>recent.add(n)); }});
  playLogs.forEach(l=>{if(daysBetween(l.date,t)<=2)recent.add(l.n)});
  const seed=hash(t+(child?child.birth:""));
  const chosen=child&&child.domain&&child.domain!=="none"?child.domain:null;
  const order=DOMS.slice().sort((a,b)=>(a===chosen?-1:0)-(b===chosen?-1:0));
  const res=[];
  order.forEach((d,i)=>{
    /* 1차 영역 우선 — 부영역(dom2) 매칭은 1차가 없을 때만. 안 그러면 화면에 같은 영역 칩이 두 번 보인다 */
    let cs=pool.filter(p=>p.dom===d&&!recent.has(p.n)&&!res.includes(p.n));
    if(!cs.length)cs=pool.filter(p=>p.dom===d&&!res.includes(p.n));
    if(!cs.length)cs=pool.filter(p=>p.dom2===d&&!recent.has(p.n)&&!res.includes(p.n));
    if(!cs.length)cs=pool.filter(p=>p.dom2===d&&!res.includes(p.n));
    if(cs.length)res.push(cs[(seed+i*7)%cs.length].n);
  });
  if(!res.length){const any=pool.filter(p=>!recent.has(p.n)); if(any.length)res.push(any[seed%any.length].n);}
  sugCache[t]={v:2,l:res};save();return res;
}

function curStage(){

function triedOK(){ return Object.keys(feed.tried).filter(n=>feed.tried[n].r!=="warn") }
function stageMeals(stage){ return stage.k==="early"?2:stage.k==="mid"?2:stage.k==="late"?3:stage.k==="done"?3:0 }
function mealsOf(stage){ return feed.mealsPerDay || stageMeals(stage) }
const STAGE_ORDER={early:1,mid:2,late:3,done:4};
function addDays(ds,n){ const d=new Date(ds+"T00:00:00"); d.setDate(d.getDate()+n); return todayStr(d); }
/* 한 달(28일) 월력표 생성 — 토핑이유식.
   3일 블록 = 「큐브 재고 세트」(한 번 만들어 소분하는 단위). 재고는 3일간 같지만,
   **끼니마다 재고에서 다른 조합**을 꺼내 쓴다 (베이스·단백질·채소 로테이션).
   새 재료는 블록당 1개 — 매일 첫 끼(오전)에 소량 포함해 3일 연속 관찰. 다음 새 재료까지 3일 간격(CDC·AAP 3~5일 하한). */
function buildMonth(fromDs, delayFirstTest){
  const stage=curStage(); if(stage.k==="pre") return;
  const n=mealsOf(stage);
  const AF=allFoods(), okSet=new Set(triedOK());
  const pool=c=>AF.filter(f=>f.cat===c&&okSet.has(f.n)).map(f=>f.n);
  const bases=pool("base"), prots=pool("protein"), vegs=pool("veg"), extras=pool("fruit").concat(pool("dairy"));
  const cand=AF.filter(f=>(STAGE_ORDER[f.s]||9)<=(STAGE_ORDER[stage.k]||0)
    && !feed.tried[f.n] && !(feed.watch&&feed.watch.name===f.n)).map(f=>f.n);
  let ci=0;
  let blockDelay = delayFirstTest?1:0;
  if(feed.testPause) ci=cand.length;
  else if(feed.watch) blockDelay=Math.max(blockDelay,1);
  const seed=hash(fromDs+(child?child.birth:""));
  const take=(arr,start,k)=>{ const out=[]; for(let t=0;t<arr.length&&out.length<k;t++){const v=arr[(start+t)%arr.length]; if(!out.includes(v))out.push(v);} return out; };
  /* 생선은 주 2회 안팎으로 제한 (식약처 생선 안전섭취 가이드·FDA 어린이 권고를 보수적으로 적용) */
  const fishSet=new Set(AF.filter(f=>f.fish).map(f=>f.n));
  const fishByDay=new Array(28).fill(0);
  const fishWeek=(di)=>{ let s=0; for(let k=Math.max(0,di-6);k<=di;k++) s+=fishByDay[k]; return s; };
  const bowl = feed.style==="bowl";
  for(let b=0; b*3<28; b++){
    const test = (b>=blockDelay && ci<cand.length) ? cand[ci++] : null;
    /* 이 블록의 재고: 베이스 최대 2 · 단백질 최대 2 · 채소 최대 4 (토핑=큐브 / 죽=끓일 죽의 재료) */
    const stockB=take(bases,seed+b,2), stockP=take(prots,seed+b,2), stockV=take(vegs,(seed+b*3)%97,4);
    /* 죽이유식: 블록마다 죽 1~2가지를 배치로 끓여 나눠 먹는다 (끼니마다 새 죽 X — 현실 조리 단위) */
    let recipes=[];
    if(bowl){
      /* 이번 주 생선 여유가 없으면 죽 재료 선정 단계에서부터 생선을 빼고 짠다
         (안 그러면 생선죽이 통째로 막혀 남은 죽 하나만 6끼 반복되는 문제) */
      const fishBlocked = fishWeek(b*3)>=2;
      const pickP=(pref)=>{ if(!pref)return null;
        if(fishSet.has(pref)&&fishBlocked) return stockP.find(x=>!fishSet.has(x))||null;
        return pref; };
      const p1=pickP(stockP[0]), p2raw=pickP(stockP[1]||stockP[0]);
      const p2=(p2raw===p1 && stockP.find(x=>x!==p1&&(!fishSet.has(x)||!fishBlocked)))||p2raw;
      const b2=stockB[1]||stockB[0];
      const rA=[].concat(stockB[0]?[stockB[0]]:[], p1?[p1]:[], stockV.slice(0,2));
      const rB=[].concat(b2?[b2]:[], p2?[p2]:[], stockV.length>2?stockV.slice(2,4):stockV.slice(0,2));
      recipes=[rA];
      if(rB.length && JSON.stringify(rB)!==JSON.stringify(rA)) recipes.push(rB);
      if(!rA.length){ recipes = extras.length? [[extras[b%extras.length]]] : [[]]; }
    }
    for(let d=0; d<3 && b*3+d<28; d++){
      const di=b*3+d, ds=addDays(fromDs,di);
      const meals=[];
      for(let m=0;m<n;m++){
        let items=[];
        if(bowl){
          /* 테스트 기간엔 첫 끼=죽1 고정(아침 관찰), 평소엔 날짜별로 죽 순서를 바꿔 단조로움 줄이기 */
          let r=recipes[(test? m : d+m)%recipes.length]||[];
          if(r.some(x=>fishSet.has(x)) && fishWeek(di)>=2){
            const alt=recipes.find(rr=>rr.length&&!rr.some(x=>fishSet.has(x)));
            r = alt || r.filter(x=>!fishSet.has(x));
          }
          items=r.slice();
          if(test && m===0 && !items.includes(test)) items.push(test); /* 새 재료는 죽에 섞기 전 따로 맛보기 */
        } else {
          const idx=d*n+m+d;  /* +d: 날짜별 오프셋 — 다음 날 같은 끼니도 조합이 밀리게 */
          if(stockB.length) items.push(stockB[idx%stockB.length]);
          if(stockP.length){
            let pn=stockP[idx%stockP.length];
            if(fishSet.has(pn) && fishWeek(di)>=2){ const alt=stockP.find(x=>!fishSet.has(x)); pn=alt||null; }
            if(pn) items.push(pn);
          }
          for(let v=0;v<2&&stockV.length;v++){ const f=stockV[(idx*2+v)%stockV.length]; if(!items.includes(f)) items.push(f); }
          if(!items.length && !test && extras.length) items.push(extras[idx%extras.length]);
          if(test && m===0 && !items.includes(test)) items.push(test);  /* 새 재료는 매일 첫 끼에만 */
        }
        if(items.some(x=>fishSet.has(x))) fishByDay[di]++;
        meals.push({items});
      }
      feed.plan[ds]={meals,test:(test&&d===0)?test:null,block:b,testItem:test||null,
        stock:{b:stockB,p:stockP,v:stockV}};
    }
  }
  feed.planMade=todayStr(); save();
}function hasPlanAhead(){ let c=0; for(let d=0;d<7;d++){ if(feed.plan[addDays(todayStr(),d)]) c++; } return c>=4; }
function weekShopping(){
  const set=new Set();
  for(let d=0;d<7;d++){ const p=feed.plan[addDays(todayStr(),d)]; if(!p)continue;
    if(p.test)set.add(p.test); (p.meals||[]).forEach(m=>(m.items||[]).forEach(i=>set.add(i))); }
  return [...set];
}

let histBusy=false, navDepth=0;
function go(v,arg){
  view=v;
  if(v==="card"||v==="browse")curPlay=arg;
  if(v==="feedback"){curPlay=arg;fb={res:null,cond:null}}
  if(v==="foodDetail")foodSel=arg;
  if(v==="planDay")planDay=arg;
  /* 화면 이동을 히스토리에 쌓아 «뒤로가기 = 이전 화면»이 되게 한다.
     같은 화면을 다시 누른 경우는 쌓지 않는다(뒤로가기가 헛도는 걸 막음) */
  const h=history.state;
  const same = h && h.v===v && h.curPlay===curPlay && h.foodSel===foodSel && h.planDay===planDay;
  if(!histBusy && !same){
    try{ history.pushState({v:v,curPlay:curPlay,foodSel:foodSel,planDay:planDay,logMode:logMode},""); navDepth++; }catch(e){}
  }
  render();window.scrollTo(0,0);
}
window.addEventListener("popstate",function(e){
  histBusy=true;
  navDepth=Math.max(0,navDepth-1);
  try{
    const st=e.state;
    if(st&&st.v){ view=st.v;
      if(st.curPlay!==undefined)curPlay=st.curPlay;
      if(st.foodSel!==undefined)foodSel=st.foodSel;
      if(st.planDay!==undefined)planDay=st.planDay;
      if(st.logMode!==undefined)logMode=st.logMode;
    } else { view="home"; }
    render();window.scrollTo(0,0);
  } finally { histBusy=false; }
});
/* ============ 안드로이드 «폰» 뒤로가기 버튼 ============
   Capacitor는 backButton 리스너가 없으면 곧장 앱을 종료해버린다.
   그래서 직접 처리한다 —
     쌓인 화면이 있으면 한 칸 뒤로 · 홈이 아니면 홈으로 · 홈이면 «한 번 더»를 물어본 뒤에만 종료.
   플러그인 접근 경로가 버전마다 달라서 세 가지를 다 시도한다. */
var hwBack={bound:false,how:"미연결"};
function capApp(){
  var C=window.Capacitor; if(!C) return null;
  if(C.Plugins&&C.Plugins.App&&C.Plugins.App.addListener){ hwBack.how="Plugins.App"; return C.Plugins.App; }
  if(typeof C.registerPlugin==="function"){
    try{ var A=C.registerPlugin("App"); if(A&&A.addListener){ hwBack.how="registerPlugin"; return A; } }catch(e){}
  }
  return null;
}
var _exitAsk=0;
function exitToast(){
  var el=document.getElementById("exitToast");
  if(!el){
    el=document.createElement("div"); el.id="exitToast";
    el.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(112px + env(safe-area-inset-bottom,0px));background:rgba(40,34,32,.94);color:#fff;padding:11px 18px;border-radius:22px;font-size:14px;font-weight:600;z-index:9999;pointer-events:none;opacity:0;transition:opacity .18s;box-shadow:0 6px 18px rgba(0,0,0,.25)";
    document.body.appendChild(el);
  }
  el.textContent="한 번 더 누르면 앱이 닫혀요";
  el.style.opacity="1";
  clearTimeout(el._t); el._t=setTimeout(function(){ el.style.opacity="0" },1800);
}
function handleHardwareBack(A){
  if(navDepth>0){ history.back(); return; }
  if(view!=="home"){ view="home"; render(); window.scrollTo(0,0); return; }
  var now=+new Date();
  if(now-_exitAsk<2000){ if(A&&A.exitApp)A.exitApp(); }
  else { _exitAsk=now; exitToast(); }
}
function bindHardwareBack(){
  if(hwBack.bound) return true;
  var A=capApp(); if(!A) return false;
  try{
    A.addListener("backButton",function(){ handleHardwareBack(A) });
    hwBack.bound=true;
  }catch(e){ hwBack.how="실패:"+e; return false; }
  return true;
}

  playLogs.forEach(l=>{ const dd=daysBetween(l.date,todayStr()); if(dd<0||dd>6) return;
    const p=PLAYS.find(x=>x.n===l.n); if(!p) return; if(cnt[p.dom]===undefined) return; cnt[p.dom]++; tot++; });
  if(!tot) return "";
  const mx=Math.max(...DOMS.map(d=>cnt[d]))||1;
  let h='<div class="card"><h3 style="margin-top:0">이번 주 해본 놀이 — '+tot+'회</h3>';
  DOMS.forEach(d=>{ h+='<div class="wkbar"><span class="wl">'+DOM_ICON[d]+' '+DOM_LABEL[d]+'</span><span class="wt"><span class="wf" style="width:'+Math.round(cnt[d]/mx*100)+'%"></span></span><span class="wv">'+cnt[d]+'</span></div>'; });
  h+='<div class="small" style="margin-top:4px">많고 적음은 채점이 아니에요 — 이번 주 어디에 손이 갔는지 보는 눈금입니다.</div></div>';
  return h;
}

function beyondNotice(){
  return '<div class="notice warm" style="font-size:13px">놀이는 아직 <b>생후 '+MAX_PLAY_M+'개월까지</b>만 있어요. '

   +'아래는 <b>'+MAX_PLAY_M+'개월 놀이</b>예요 — 생후 '+monthAge()+'개월 아이에게 딱 맞는 건 아닙니다. '
   +'그래도 «조건을 하나만 바꿔서 다시 해본다»는 방식은 몇 개월이든 그대로 쓰실 수 있어요.</div>';

function playResults(){
  const q=(playQ||"").trim().toLowerCase();
  if(!q){
    const m=Math.min(monthAge(),MAX_PLAY_M);
    let h='';
    if(beyondPlays()){
      h+='<h3>'+MAX_PLAY_M+'개월 놀이 (지금 있는 것 중 가장 큰 월령)</h3>'+beyondNotice();
    } else {
      h+='<h3>지금 월령('+monthAge()+'개월) 놀이</h3>';
    }
    const now=PLAYS.filter(p=>p.m===m);
    now.forEach(p=>{h+=playRow(p)});
    if(!now.length) h+='<div class="small">이 월령 놀이가 아직 없어요. 위의 영역 단추로 둘러보세요.</div>';
    return h;
  }
  const hit=PLAYS.filter(p=>[p.name,p.mat,p.how,p.dom,p.dom2,p.label,"놀이"+p.n].join(" ").toLowerCase().indexOf(q)>=0);
  let h='<h3>「'+esc(playQ)+'」 '+hit.length+'개</h3>';
  if(!hit.length) h+='<div class="small">그 말이 들어간 놀이가 없어요. 준비물 이름(손수건·공·거울·초점책)이나 「까꿍」처럼 놀이 이름의 한 조각으로 찾아보세요.</div>';

}

       :'재고(큐브)는 3일 단위(×1=한 끼 분량 큐브 1개), <b>끼니 조합은 매번 달라요.</b> 🧪 새 재료만 매일 첫 끼(오전)에 넣어 3일 연속 지켜봐요.')
  +' <b>재료 이름을 누르면 조리법·양</b>, 날짜를 누르면 수정.</div>'
  +(bw2?'<div class="notice" style="font-size:12.5px;margin-top:6px">🍲 <b>죽이유식</b>: 죽을 한 번에 끓여 <b>한 끼 분량씩 나눠 담아요</b>. 냉장은 2~3일 안에, 더 두려면 냉동(해동·재가열 규칙은 아래 보관 규칙과 같아요).<br>📏 <b>'+curStage().nm+' 배합</b> — '+esc(BOWL_FORMULA[curStage().k]||"")+'</div>':'');
  return h;
}
function monthCal(){
  const t=todayStr();
  let h='<div class="cal">';
  ["일","월","화","수","목","금","토"].forEach(d=>h+='<div class="h">'+d+'</div>');
  const first=new Date(t+"T00:00:00");
  for(let i=0;i<first.getDay();i++) h+='<div></div>';
  for(let d=0; d<28; d++){
    const ds=addDays(t,d), p=feed.plan[ds];
    const dt=new Date(ds+"T00:00:00");
    const cls=["d"]; if(ds===t)cls.push("today"); if(ds===foodCalSel)cls.push("sel");
    const mark = p&&p.test ? '<div style="font-size:9.5px;line-height:1.1;font-weight:800;color:var(--coral)">🧪'+esc(p.test.slice(0,3))+'</div>' : (p?'':'<div style="font-size:9px;color:var(--sub)">—</div>');
    h+='<div class="'+cls.join(" ")+'" style="padding:4px 0 3px" onclick="foodCalSel=(foodCalSel===\''+ds+'\'?null:\''+ds+'\');render()">'+dt.getDate()+mark+'</div>';
  }
  h+='</div><div class="small" style="margin-top:6px">🧪 = 새 재료 처음 먹여보는 날 (그 뒤 3일은 자동으로 새 재료 없음)</div>';
  return h;
}

function addCustomFood(){
  const n=prompt("재료 이름 (예: 브로콜리)"); if(!n||!n.trim())return;
  const nm=n.trim();
  if(allFoods().some(f=>f.n===nm)){alert("이미 목록에 있어요.");return}
  const c=prompt("종류를 골라주세요:\n1 베이스(곡물)  2 단백질  3 채소  4 과일  5 유제품","3");
  const cat=({1:"base",2:"protein",3:"veg",4:"fruit",5:"dairy"})[(c||"3").trim()]||"veg";
  feed.custom=feed.custom||[]; feed.custom.push({n:nm,cat,s:"mid"});
  feed.tried[nm]={d:"이전",r:"ok"};   /* 직접 추가 = 이미 먹여본 재료라는 뜻 */
  save(); render();
}
function toast_(m){ alert(m); }
function setupToggle(n){
  if(feed.watch&&feed.watch.name===n){ alert("지금 관찰 중인 재료예요."); return; }
  if(feed.tried[n]){ delete feed.tried[n]; } else { feed.tried[n]={d:"이전",r:"ok"}; }
  save(); render();
}

function testFed(n){ feed.watch={name:n,start:todayStr()}; save(); render(); }
function postponeTest(){ buildMonth(todayStr(),1); render(); }

function setMeals(){
  const v=prompt("하루에 이유식을 몇 끼 먹나요? (1~3)\n비우면 단계 기본값("+stageMeals(curStage())+"끼)으로 돌아가요.",feed.mealsPerDay||"");

  const v=prompt("이달의 목표 (달력 맨 위에 붙어요)",feed.goal||"");
  if(v===null)return; feed.goal=v.trim(); save(); render();
}

function toggleStyle(){
  feed.style = feed.style==="bowl" ? "top" : "bowl";
  if(hasPlanAhead()) buildMonth(todayStr());
  save(); render();
}
function stageOverride(){
  const v=prompt("지금 단계: "+curStage().nm+(feed.stageOv?" (직접 설정됨)":" (개월수 자동)")
    +"\n\n아이마다 진행이 달라서 단계를 직접 정할 수 있어요:\n1 초기 · 2 중기 · 3 후기 · 4 완료기\n\n숫자를 입력하세요. 비우고 확인하면 개월수 자동으로 돌아가요.","");
  if(v===null)return;
  const t=v.trim();
  if(t===""){feed.stageOv=null}
  else{
    const map={"1":"early","2":"mid","3":"late","4":"done"};
    const k=map[t]||(STAGES.some(x=>x.k===t)?t:null);
    if(!k){alert("1~4 숫자로 적어주세요.");return}
    feed.stageOv=k;
  }
  buildMonth(todayStr()); save(); render();
}
function copyPlan(){
  const rows=[["날짜","테스트","끼니"]];
  for(let d=0;d<28;d++){ const ds=addDays(todayStr(),d), p=feed.plan[ds]; if(!p)continue;
    rows.push([ds, p.test?("🧪"+p.test):"", (p.meals||[]).map(m=>(m.items||[]).join("+")||"-").join(" / ")]); }
  const txt=rows.map(r=>r.join("\t")).join("\n");
  const done=()=>alert("복사했어요. 시트에 붙여넣으세요.");
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(txt,done));
  else fallbackCopy(txt,done);
}
function vPlanDay(){
  const ds=planDay, st=curStage(), n=mealsOf(st);
  if(!feed.plan[ds]) feed.plan[ds]={meals:[],test:null};
  const P=feed.plan[ds];
  while((P.meals||[]).length<n)P.meals.push({items:[]});
  const ok=triedOK();
  let h='<div class="fade"><button class="ghost" onclick="go(\'food\')">← 이유식으로</button>'
  +'<h2 class="hd">'+ds+' 식단</h2><div class="small" style="margin-bottom:8px">'+st.nm+' · '+st.form
  +(P.test?' · <b style="color:var(--coral)">🧪 '+esc(P.test)+' 테스트일</b>':'')+'</div>';
  P.meals.forEach((meal,mi)=>{
    h+='<div class="card"><h3 style="margin-top:0">'+(mi+1)+'번째 끼니</h3><div>';
    const opts=[...new Set([...(P.test&&mi===0?[P.test]:[]),...ok])];
    opts.forEach(f=>{const on=(meal.items||[]).includes(f);
      h+='<button class="condbtn '+(on?"on":"")+'" onclick="toggleMeal(\''+ds+'\','+mi+',\''+f.replace(/'/g,"\\'")+'\')">'+esc(f)+(f===P.test?" 🧪":"")+'</button>'});
    if(!opts.length)h+='<div class="small">먹어본 재료가 없어요. 「먹어본 음식 고르기」부터.</div>';
    h+='</div></div>';
  });

}
function toggleMeal(ds,mi,f){

}

     +'<div style="font-size:13.5px;font-weight:700;line-height:1.5">'+esc((prev.input||"—").slice(0,60))+' → '+esc((prev.output||"—").slice(0,60))+'</div>'
     +'<div class="small" style="margin-top:5px">오늘은 <b>조건 하나만 바꿔서</b> 다시 해보면, 그게 관찰이 됩니다.</div></div>';

  +'<label class="f">생각나는 것 (안 써도 돼요)</label><textarea id="lgNote" placeholder="예: 크기 선호인가? 내일 순서를 바꿔봐야지"></textarea>'
  +'<label class="f">영역 (해당되는 것 모두)</label><div id="lgDoms">';
  DOMS.forEach(d=>{h+='<button class="condbtn" data-d="'+d+'" onclick="this.classList.toggle(\'on\')">'+DOM_ICON[d]+' '+DOM_LABEL[d]+'</button>'});
  h+='</div><div style="margin-top:12px"><button class="pri" onclick="logSave()">저장</button></div>'
  +'<div class="small" style="margin-top:10px">💡 자극 → 반응 → 생각. 이 세 칸이 이 앱의 심장이에요. 나눠 적는 순간 부모는 관찰자가 됩니다.</div></div>';
  const todays=logs.filter(l=>l.date===t);
  if(todays.length){h+='<h3>오늘 기록 '+todays.length+'건</h3>';todays.forEach(l=>{h+=logItem(l,logs.indexOf(l))});

function logItem(l,idx){

function logDel(i){
  const l=logs[i]; if(!l) return;
  if(!confirm("이 기록을 지울까요?\n\n"+(l.input||"")+"\n→ "+(l.output||""))) return;
  logs.splice(i,1); save(); render();
}
function logSave(){
  const i=$("#lgIn").value.trim(),o=$("#lgOut").value.trim(),nt=$("#lgNote").value.trim();
  if(!i&&!o&&!nt){alert("한 칸이라도 적어주세요.");return}
  const doms=[...document.querySelectorAll("#lgDoms .condbtn.on")].map(b=>b.dataset.d);
  logs.push({date:todayStr(),input:i,output:o,note:nt,doms});save();render();
}
function copyTSV(date){
  const rows=logs.filter(l=>l.date===date).map(l=>
    [l.date,"D"+dayNum(l.date),(l.doms||[]).join("/"),l.input,l.output,l.note].map(x=>(x||"").replace(/\t/g," ").replace(/\n/g," ")).join("\t")).join("\n");
  const done=()=>alert("복사했어요. 구글 시트에 붙여넣으세요.");
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(rows).then(done,()=>fallbackCopy(rows,done));
  else fallbackCopy(rows,done);
}
function fallbackCopy(t,cb){const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);
 ta.select();try{document.execCommand("copy")}catch(e){}document.body.removeChild(ta);cb()}

/* ============ 달력 ============ */
function vCalInner(){
  if(!calMonth){const n=new Date();calMonth={y:n.getFullYear(),m:n.getMonth()}}
  const{y,m}=calMonth;
  const first=new Date(y,m,1),start=first.getDay(),days=new Date(y,m+1,0).getDate();
  const logDates=new Set(logs.map(l=>l.date).concat(playLogs.map(l=>l.date)));
  let h='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">'
  +'<button class="ghost" onclick="calShift(-1)">◀</button><b class="hd" style="font-size:16px">'+y+'년 '+(m+1)+'월</b><button class="ghost" onclick="calShift(1)">▶</button></div><div class="cal">';
  ["일","월","화","수","목","금","토"].forEach(d=>h+='<div class="h">'+d+'</div>');
  for(let i=0;i<start;i++)h+='<div></div>';
  for(let d=1;d<=days;d++){
    const ds=y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    const cls=["d"];if(logDates.has(ds))cls.push("dot");if(ds===todayStr())cls.push("today");if(ds===calSel)cls.push("sel");
    h+='<div class="'+cls.join(" ")+'" onclick="calSel=\''+ds+'\';render()">'+d+'</div>'}
  h+='</div><div class="small" style="margin-top:8px">● 기록 있음 — 빈 날엔 아무 표시도 안 해요. 「놓친 날」 같은 건 없어요.</div></div>';
  h+='<div class="card"><label class="f" style="margin-top:0">🔍 기록 검색</label><input type="text" id="q" placeholder="예: 뒤집기" oninput="renderSearch(this.value)"><div id="qRes"></div></div>';
  if(calSel){
    const dl=logs.filter(l=>l.date===calSel),pl=playLogs.filter(l=>l.date===calSel);
    h+='<h3>'+calSel+'</h3>';
    if(!dl.length&&!pl.length)h+='<div class="sub">기록이 없어요.</div>';
    dl.forEach(l=>h+=logItem(l,logs.indexOf(l)));
    pl.forEach(l=>{const p=PLAYS.find(x=>x.n===l.n);
      h+='<div class="card" style="padding:11px 14px;font-size:14px">'+(l.res?({happy:"😀",meh:"😐",sad:"🙁",skip:"⏭"})[l.res]||"✅":"✅")+' <b>'+esc(p?p.name:l.n)+'</b>'
      +(l.cond?' <span class="chip">'+CONDS.find(c=>c[0]===l.cond)[1]+'</span>':"")+'</div>'});
    if(dl.length)h+='<button class="sec" onclick="copyTSV(\''+calSel+'\')">📋 이 날짜 시트용 복사</button>';
  }

function ageAtStr(d){
  if(!child||!child.birth)return "";
  const b=new Date(child.birth+"T00:00:00"), t=new Date(d+"T00:00:00");
  if(!(t>=b))return "";
  let mo=(t.getFullYear()-b.getFullYear())*12+(t.getMonth()-b.getMonth());
  let anchor=new Date(b); anchor.setMonth(b.getMonth()+mo);
  if(anchor>t){ mo--; anchor=new Date(b); anchor.setMonth(b.getMonth()+mo); }
  const days=Math.round((t-anchor)/86400000);
  return "생후 "+mo+"개월 "+days+"일";
}

/* ============ 수면 ============
   기록 모델: {d:"YYYY-MM-DD"(시작일), s:"HH:MM", e:"HH:MM", n:1(낮잠)|0(밤잠)}
   자정을 넘는 밤잠은 하나의 기록으로 둔다 (베이비타임의 알려진 버그를 피함) */
function hm2m(t){ const [a,b]=(t||"0:0").split(":").map(Number); return (a||0)*60+(b||0); }
function m2hm(m){ m=((m%1440)+1440)%1440; return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"); }
function durMin(x){ let d=hm2m(x.e)-hm2m(x.s); if(d<0)d+=1440; return d; }
function fmtDur(m){ const h=Math.floor(m/60), r=m%60; return (h?h+"시간":"")+(r?(h?" ":"")+r+"분":(h?"":"0분")); }
function sleepsOn(ds){ return sleeps.filter(x=>x.d===ds); }
/* 그날의 총 수면: 그날 시작한 잠 + 전날 밤잠이 넘어온 분량 */
function sleepTotal(ds){
  let t=0;
  sleepsOn(ds).forEach(x=>{ t+=durMin(x); });
  const prev=sleeps.filter(x=>x.d===addDays(ds,-1) && !x.n && hm2m(x.e)<hm2m(x.s));
  return t;
}
function napCount(ds){ return sleepsOn(ds).filter(x=>x.n).length; }
function sleepRange(arr,m){ for(const r of arr){ if(m>=r[0]&&m<r[1])return r; } return null; }
function wakeWindows(ds){
  const day=sleepsOn(ds).slice().sort((a,b)=>hm2m(a.s)-hm2m(b.s));
  const out=[];
  for(let i=0;i<day.length-1;i++){
    let gap=hm2m(day[i+1].s)-hm2m(day[i].e); if(gap<0)gap+=1440;
    if(gap>0&&gap<720) out.push(gap);
  }
  return out;
}
let sleepDay=null;
function sleep7(){
  /* 최근 7일 수면 — 밤잠(보라)·낮잠(하늘) 쌓기. 숫자는 그날 «시작한» 잠의 합(시간).
     권장선은 긋지 않는다 — 그래프는 눈금이지 채점표가 아니다. */
  const days=[]; let maxT=0;
  for(let i=6;i>=0;i--){ const d=addDays(todayStr(),-i);
    let nt=0,np=0; sleepsOn(d).forEach(x=>{ if(!x.e)return; const v=durMin(x); if(x.n)np+=v; else nt+=v; });
    maxT=Math.max(maxT,nt+np); days.push({d,nt,np}); }
  if(maxT===0) return "";
  const WD=["일","월","화","수","목","금","토"];
  let h='<div class="card"><h3 style="margin-top:0">최근 7일</h3><div class="g7" aria-hidden="true">';
  days.forEach(x=>{ const hN=Math.round(x.nt/maxT*100), hP=Math.round(x.np/maxT*100);
    h+='<div class="col">'+(x.np?'<div class="seg nap" style="height:'+hP+'%"></div>':'')+(x.nt?'<div class="seg n8" style="height:'+hN+'%"></div>':'')+'</div>'; });
  h+='</div><div class="g7lab">';
  days.forEach(x=>{ const dt=new Date(x.d+"T00:00:00"); const tot=x.nt+x.np;
    h+='<span>'+WD[dt.getDay()]+'<br>'+(tot?(Math.round(tot/6)/10):'·')+'</span>'; });
  h+='</div><div class="small" style="margin-top:6px"><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--lav);vertical-align:-1px"></span> 밤잠  <span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--sky);vertical-align:-1px;margin-left:8px"></span> 낮잠 · 아래 숫자는 시간</div></div>';
  return h;
}

  const rec=sleepRange(SLEEP_TOTAL,m), nap=sleepRange(NAP_OBS.map(x=>[x[0],x[1],x[2],x[3],x[4]]),m), ww=sleepRange(WAKE_COM,m);

function nowHM(){ const d=new Date(); return m2hm(d.getHours()*60+d.getMinutes()); }

function sleepStart(n){

function sleepEnd(){

function slNudge(mm){ const x=sleeps.find(y=>y.on); if(!x)return; x.s=m2hm(hm2m(x.s)+mm); save(); render(); }

function tParse(v){ v=(v||"").trim().replace(/[.시]/g,":").replace(/분/g,"");
  const mm=v.match(/^(\d{1,2}):?(\d{2})$/); if(!mm)return null;
  const a=+mm[1], b=+mm[2]; if(a>23||b>59)return null; return m2hm(a*60+b); }

/* ============ 📈 WHO 성장 백분위 ============ */
function growthPct(g,gk){
  if(!child||!child.sex)return null;
  const def=GKEYS.find(x=>x.k===gk); if(!def)return null;
  const v=parseFloat(g[def.f]); if(!v||v<=0)return null;
  const m=monthsBetween(child.birth,g.date);
  if(m<0||m>24)return null;
  const p=lmsAt(def.lms(child.sex),m); if(!p)return null;
  return {m, v, z:zLMS(p[0],p[1],p[2],v), pct:pctFromZ(zLMS(p[0],p[1],p[2],v))};
}
function monthsBetween(b,d){ return daysBetween(b,d)/30.4375; }
function growthChart(gk){
  const def=GKEYS.find(x=>x.k===gk); if(!def||!child||!child.sex)return "";
  const key=def.lms(child.sex);
  const W=320,H=200,PL=34,PR=8,PT=10,PB=22;
  const maxM=Math.max(6,Math.min(24,Math.ceil(monthAge()+2)));
  const zs=[-2,-1,0,1,2];
  let vmin=1e9,vmax=-1e9;
  const curves=zs.map(z=>{
    const pts=[];
    for(let m=0;m<=maxM;m+=0.5){ const v=valueAtZ(key,m,z); if(v==null)continue; pts.push([m,v]); vmin=Math.min(vmin,v); vmax=Math.max(vmax,v); }
    return {z,pts};
  });
  const mine=growth.map(g=>{const r=growthPct(g,gk); return r?[r.m,r.v,g.date,r.pct]:null}).filter(Boolean).filter(p=>p[0]<=maxM);
  mine.forEach(p=>{vmin=Math.min(vmin,p[1]);vmax=Math.max(vmax,p[1])});
  const pad=(vmax-vmin)*0.08||1; vmin-=pad; vmax+=pad;
  const X=m=>PL+(m/maxM)*(W-PL-PR), Y=v=>PT+(1-(v-vmin)/(vmax-vmin))*(H-PT-PB);
  const path=pts=>pts.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join(" ");
  let sv='<svg class="gchart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+def.nm+' 성장 곡선">';
  /* 3~97 백분위 밴드 */
  const band=(a,b2,op)=>{
    const A=curves.find(c=>c.z===a).pts, B=curves.find(c=>c.z===b2).pts.slice().reverse();
    return '<path d="'+path(A)+" "+B.map(p=>"L"+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join(" ")+' Z" fill="var(--mint)" opacity="'+op+'"/>';
  };
  sv+=band(-2,2,.28)+band(-1,1,.34);
  curves.forEach(c=>{
    sv+='<path d="'+path(c.pts)+'" fill="none" stroke="var(--sub)" stroke-width="'+(c.z===0?1.6:0.8)+'" opacity="'+(c.z===0?.75:.4)+'"'+(c.z===0?"":' stroke-dasharray="3 3"')+'/>';
  });
  /* 축 */
  for(let m=0;m<=maxM;m+=(maxM>12?6:3)) sv+='<text x="'+X(m)+'" y="'+(H-6)+'" font-size="9" fill="var(--sub)" text-anchor="middle">'+m+'개월</text>';
  [vmin+(vmax-vmin)*0.1, (vmin+vmax)/2, vmax-(vmax-vmin)*0.1].forEach(v=>{
    sv+='<text x="4" y="'+(Y(v)+3)+'" font-size="9" fill="var(--sub)">'+v.toFixed(v>20?0:1)+'</text>';
  });
  /* 우리 아이 */
  if(mine.length>1) sv+='<path d="'+path(mine)+'" fill="none" stroke="var(--coral)" stroke-width="2.4" stroke-linecap="round"/>';
  mine.forEach(p=>{ sv+='<circle cx="'+X(p[0]).toFixed(1)+'" cy="'+Y(p[1]).toFixed(1)+'" r="4" fill="var(--coral)"/>'; });
  sv+='</svg>';
  return sv;
}
function vGrowthCard(){
  let h='<div class="card"><div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px">'
   +'<h2 class="hd" style="font-size:16px;margin:0">📈 성장 곡선 '+evb("off","WHO Child Growth Standards 2006 — 모유수유아 기준 국제 표준")+'</h2></div>';

       +'중요한 건 숫자 하나가 아니라 <b>그 아이만의 선이 꾸준히 올라가는지</b>예요. 판단은 검진 때 의사 선생님이 합니다.</div>';
    }
  } else {
    h+='<div class="small" style="margin:8px 0">키·몸무게를 한 번이라도 적으면 WHO 표준 곡선 위에 우리 아이 점이 찍혀요.</div>';
  }
  h+='<button class="ghost" onclick="addGrowth()">+ 오늘 기록 추가</button></div>';
  return h;
}

    const click = v ? ' onclick="store.set(\'seenNew\',WHATS_NEW.v);go(\''+v+'\')" style="cursor:pointer;padding:7px 0;border-bottom:1.5px solid var(--line)"'
                    : ' style="padding:7px 0;border-bottom:1.5px solid var(--line)"';
    h+='<div'+click+'>'
     +'<div style="font-size:14px;font-weight:800">'+a+(v?' <span style="color:var(--coral)">→</span>':'')+'</div>'
     +'<div class="small">'+b2+'</div></div>';
  });
  h+='<button class="ghost" style="width:100%;margin-top:6px" onclick="store.set(\'seenNew\',WHATS_NEW.v);render()">다 봤어요</button></div>';
  return h;
}

/* ============ 🛟 백업 안내 ============
   서버가 없다는 건 «내 기록이 남에게 안 간다»는 뜻이자 «기기를 잃으면 끝»이라는 뜻이기도 하다.
   그래서 배지·연속기록 대신, 조용한 안전 안내를 둔다. (경쟁앱들이 이걸 유료화한 지점) */
function backupDue(){
  const first=store.get("firstUse"), last=store.get("lastBackup");
  if(!first){ store.set("firstUse",todayStr()); return false; }
  const total=logs.length+playLogs.length+Object.keys(feed.plan||{}).length+sleeps.length+growth.length;
  if(total<5) return false;                                   /* 쌓인 게 없으면 조르지 않는다 */
  if(store.get("backupSnooze")===todayStr()) return false;
  if(!last) return daysBetween(first,todayStr())>=3;          /* 시작 3일 뒤 한 번 */
  return daysBetween(last,todayStr())>=30;                    /* 이후 한 달에 한 번 */
}
function backupCard(){
  if(!backupDue())return"";
  const last=store.get("lastBackup");
  return '<div class="card" style="border-color:var(--sky)">'
   +'<div style="font-size:14.5px;font-weight:800">🛟 기록을 한 번 꺼내두실래요?</div>'
   +'<div class="small" style="margin:5px 0 9px">이 앱은 서버가 없어서 기록이 <b>이 기기 안에만</b> 있어요. 남에게 새어 나갈 일이 없는 대신, 앱을 지우거나 폰을 바꾸면 같이 사라져요. '
   +(last?'마지막 백업은 '+last+'였어요.':'글자로 복사해 카톡에 붙여두면 끝이에요 — 30초면 돼요.')+'</div>'
   +'<div class="row"><button class="sec" onclick="go(\'backup\')">🛟 지금 백업</button>'
   +'<button class="ghost" onclick="store.set(\'backupSnooze\',todayStr());render()">나중에</button></div></div>';
}

/* ============ 📤 하루 요약 공유 ============
   서버 없는 앱이 «공동양육»을 푸는 방법: 실시간 동기화 대신 «오늘 하루»를 통째로 보내준다.
   조부모·시터·배우자에게 카톡으로. 개인정보가 서버를 거치지 않는다는 게 오히려 장점. */
function dayDigest(ds){
  ds=ds||todayStr();
  const L=[], nm=(child&&child.name)||"우리 아이";
  const dt=new Date(ds+"T00:00:00");
  L.push("🦔 "+nm+" — "+(dt.getMonth()+1)+"월 "+dt.getDate()+"일 ("+ageText()+")");
  L.push("");
  /* 잠 */
  const sl=sleepsOn(ds).slice().sort((a,b)=>hm2m(a.s)-hm2m(b.s));
  if(sl.length){
    L.push("🌙 잠 — 합쳐서 "+fmtDur(sleepTotal(ds))+" (낮잠 "+napCount(ds)+"회)");
    sl.forEach(x=>L.push("  "+(x.n?"🌤":"🌙")+" "+x.s+"~"+x.e+" ("+fmtDur(durMin(x))+")"));
  }
  /* 이유식 */
  const p=feed.plan[ds];
  if(p&&p.meals&&p.meals.length){
    L.push("🍚 이유식"+(feed.style==="bowl"?" (죽)":" (토핑)"));
    p.meals.forEach((m,i)=>{ const it=(m.items||[]); if(it.length)L.push("  "+(i+1)+"끼: "+it.join(feed.style==="bowl"?" + ":" · ")); });
    if(p.testItem)L.push("  🧪 새 재료: "+p.testItem+" — 두드러기·구토·설사 있는지 봐주세요");
  }
  /* 관찰 기록 */
  const lg=logs.filter(x=>x.date===ds);
  if(lg.length){
    L.push("✏️ 오늘 본 것");
    lg.forEach(x=>{ const t=(x.output||x.input||"").trim(); if(t)L.push("  · "+t.slice(0,80)); });
  }
  /* 놀이 */
  const pl=playLogs.filter(x=>x.date===ds);
  if(pl.length){
    const names=pl.map(x=>{const q=PLAYS.find(y=>y.n===x.n); return q?q.name:null}).filter(Boolean);
    if(names.length)L.push("🧸 놀이 — "+names.join(", "));
  }
  if(L.length<=2)L.push("(아직 오늘 기록이 없어요)");
  L.push("");
  L.push("— 고슴이 앱에서 보냄");
  return L.join("\n");
}
function shareDay(ds){
  const txt=dayDigest(ds);
  if(navigator.share){
    navigator.share({title:"오늘 하루",text:txt}).catch(()=>copyDigest(txt));
  } else copyDigest(txt);
}
function copyDigest(txt){
  const done=()=>alert("복사했어요!\n카톡에 붙여넣으면 됩니다.");
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(txt,done));
  else fallbackCopy(txt,done);
}

function checkupNext(){ const m=monthAge(); for(const k of CHECKUP){ if(m<k[0])return k; } return null; }

  const warns=Object.keys(feed.tried).filter(n=>feed.tried[n].r==="warn");
  if(Object.keys(feed.tried).length){h+='<h2>이유식</h2><p>먹어본 재료: '+Object.keys(feed.tried).join(", ")+'</p>';
    if(warns.length)h+='<p><b>이상 반응이 있었던 재료: '+warns.map(n=>n+"("+feed.tried[n].d+")").join(", ")+'</b></p>'}
  h+='<h2>최근 8주 관찰 기록 ('+recent.length+'건)</h2><table><tr><th>날짜</th><th>자극(해준 것)</th><th>반응(아이가 한 것)</th><th>비고</th></tr>';
  recent.slice(-40).forEach(l=>{h+='<tr><td>'+l.date+'</td><td>'+esc(l.input)+'</td><td>'+esc(l.output)+'</td><td>'+esc(l.note||"")+'</td></tr>'});
  h+='</table><p>놀이 반응 누계: 재밌어함 '+pc.happy+' · 보통 '+pc.meh+' · 관심 없음 '+pc.sad+' · 미수행 '+pc.skip+(pc.quick?' · 완료 표시만 '+pc.quick:'')+'</p>'
  +'<p style="font-size:10px">'+esc(DISCLAIMER)+' '+esc(FOOD_DISCLAIMER)+'</p>';
  $("#printArea").innerHTML=h;window.print();

/* ============ 불편한 점 알려주기 ============
   앱 안에서 나가지 않고, 어느 화면에서 막혔는지까지 같이 담아 복사해준다.
   버전 번호를 따로 두지 않는다 — 기록 일수와 놀이 개수가 곧 그 앱의 판본이다. */
const VIEW_NAME={home:"오늘(홈)",plays:"놀이 목록",browse:"놀이 둘러보기",card:"놀이 카드",feedback:"놀이 해본 뒤",
 food:"이유식",foodSetup:"먹어본 음식 고르기",foodDetail:"재료 상세",planDay:"그날 식단",log:"기록 쓰기",
 sleep:"수면",er:"이럴 땐 병원에",moon:"달빛어린이병원",map:"우리 아이 지도",vax:"예방접종 체크",backup:"기록 옮기기",
 summary:"진료실용 요약",settings:"설정",onboard:"처음 설정",worry:"걱정될 때"};
function appShare(){
  /* 카톡 오픈채팅·단톡방으로 앱을 알리는 문 — 폰의 공유판을 그대로 쓴다(무료·키 없음).
     공유판이 없는 웹뷰에선 복사로 대신한다. */
  const url="https://goseumi-app.github.io/";
  const text="고슴이 🦔 하루 5분, 오늘 아기와 뭐 하고 놀지 골라주는 무료 기록장이에요. 설치·가입 없이 주소로 바로 열려요.";
  if(navigator.share){ navigator.share({title:"고슴이",text:text,url:url}).catch(function(){}); return; }
  const msg=text+"\n"+url;
  const done=function(){alert("소개 문구를 복사했어요.\n카톡 대화방이나 오픈채팅에 붙여넣으면 됩니다.")};
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(msg).then(done,function(){fallbackCopy(msg,done)});
  else fallbackCopy(msg,done);
}
function sendFeedback(){
  const where=VIEW_NAME[view]||view;
  const t=prompt("어디서 막히셨는지, 뭐가 불편하셨는지 한 줄로 적어주세요.\n(「"+where+"」 화면에서 쓰신 걸로 함께 보냅니다)");
  if(t===null) return;
  if(!t.trim()){ alert("내용이 비어 있어요."); return }
  const msg="[고슴이 피드백]\n화면: "+where+"\n판본: 기록 "+REC_DAYS+"일 · 놀이 "+PLAYS.length+"개\n아이: 생후 "+monthAge()+"개월\n\n"+t.trim();
  const done=()=>alert("복사했어요.\n\n카카오 오픈채팅 사용자 방(설정의 바로 아래 단추)이나 쓰레드 @goseumi.app 댓글에 붙여넣어 주세요.\n어디서 막혔는지가 제일 도움이 됩니다.");
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(msg).then(done,()=>fallbackCopy(msg,done));
  else fallbackCopy(msg,done);
}

/* ============ 기록 백업 · 되살리기 ============
   앱(WebView) 안에서는 파일 내려받기가 막혀 있을 수 있다. 그래서 «텍스트»가 정본 경로다 —
   복사해서 카톡 «나에게 보내기»에 붙여두면 폰을 갈아도, 앱을 지웠다 깔아도 살아난다. */
function backupJSON(){
  return JSON.stringify({v:3,exported:todayStr(),child,logs,playLogs,playState,miles,feed,growth,appts,shop,sleeps,vax});
}
function applyBackup(d){
  if(!d||!d.child||!Array.isArray(d.logs)) throw new Error("형식이 아니에요");
  child=d.child; logs=d.logs; playLogs=d.playLogs||[]; playState=d.playState||{}; miles=d.miles||{};
  feed=d.feed||{tried:{},watch:null,plan:{},stageOv:null}; growth=d.growth||[]; appts=d.appts||[];
  shop=d.shop||{partner:{},on:false}; sleeps=d.sleeps||[];
  vax=d.vax||{rec:{},flu:[]}; if(!vax.rec)vax.rec={}; if(!Array.isArray(vax.flu))vax.flu=[];
  save();
}

function bkCopy(){
  const ta=$("#bkOut"); if(!ta)return;
  const t=ta.value;
  const done=()=>{ store.set("lastBackup",todayStr()); alert("복사했어요.\n\n카카오톡 「나에게 보내기」나 메모장에 붙여넣어 두세요."); render() };
  try{ ta.focus(); ta.setSelectionRange(0,t.length); }catch(e){}
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done,()=>fallbackCopy(t,done));
  else fallbackCopy(t,done);
}
/* 두 사람이 각자 폰에 쌓은 기록을 «더하는» 쪽. 겹치는 건 건너뛴다 */
function mergeBackup(d){
  const n={logs:0,plays:0,sleeps:0,growth:0,appts:0,foods:0,miles:0,vax:0,flu:0};
  const key=(o,ks)=>ks.map(k=>String(o[k]==null?"":o[k])).join("\u0001");
  const uni=(cur,inc,ks,cnt)=>{
    const seen=new Set(cur.map(o=>key(o,ks)));
    (inc||[]).forEach(o=>{ const k=key(o,ks); if(!seen.has(k)){ seen.add(k); cur.push(o); n[cnt]++ } });
  };
  uni(logs, d.logs, ["date","input","output","note"], "logs");
  uni(playLogs, d.playLogs, ["date","n","res"], "plays");
  uni(sleeps, d.sleeps, ["d","s","e"], "sleeps");
  uni(growth, d.growth, ["date","h","w","hd"], "growth");
  uni(appts, d.appts, ["date","label"], "appts");
  const dt=(d.feed&&d.feed.tried)||{};
  Object.keys(dt).forEach(k=>{ if(!feed.tried[k]){ feed.tried[k]=dt[k]; n.foods++ } });
  Object.keys(d.miles||{}).forEach(k=>{ const a=miles[k], b=d.miles[k];
    if(!a){ miles[k]=b; n.miles++ } else if(b&&b<a){ miles[k]=b } });   /* 먼저 한 날짜를 남긴다 */
  const rec=(d.vax&&d.vax.rec)||{};
  Object.keys(rec).forEach(k=>{ const a=vax.rec[k], b=rec[k];
    if(a===undefined){ vax.rec[k]=b; n.vax++ }
    else if(typeof a!=="string" && typeof b==="string"){ vax.rec[k]=b } });  /* 날짜가 적힌 쪽을 남긴다 */
  ((d.vax&&d.vax.flu)||[]).forEach(x=>{ if(vax.flu.indexOf(x)<0){ vax.flu.push(x); n.flu++ } });
  vax.flu.sort();
  logs.sort((a,b)=>a.date<b.date?-1:1);
  playLogs.sort((a,b)=>a.date<b.date?-1:1);
  save();
  return n;
}
function bkParse(){
  const ta=$("#bkIn"); if(!ta) return null;
  const t=(ta.value||"").trim();
  if(!t){ alert("붙여넣은 글자가 없어요."); return null }
  try{ return JSON.parse(t) }
  catch(e){ alert("백업 글자가 아닌 것 같아요.\n앞의 { 부터 뒤의 } 까지 통째로 붙여넣어 주세요."); return null }
}
function bkMerge(){
  const d=bkParse(); if(!d) return;
  if(!d.logs&&!d.vax&&!d.playLogs){ alert("이 앱의 백업이 아닌 것 같아요."); return }
  if(!confirm("지금 기록은 그대로 두고, 저쪽에만 있는 것을 더합니다.\n겹치는 기록은 건너뜁니다. 계속할까요?")) return;
  let n; try{ n=mergeBackup(d) }catch(e){ alert("합치지 못했어요. 백업 글자가 온전한지 확인해 주세요."); return }
  const parts=[];
  if(n.logs)parts.push("관찰 "+n.logs+"건"); if(n.plays)parts.push("놀이 "+n.plays+"회");
  if(n.sleeps)parts.push("수면 "+n.sleeps+"건"); if(n.growth)parts.push("성장 "+n.growth+"건");
  if(n.appts)parts.push("일정 "+n.appts+"건"); if(n.foods)parts.push("먹어본 재료 "+n.foods+"개");
  if(n.miles)parts.push("이정표 "+n.miles+"개"); if(n.vax)parts.push("접종 "+n.vax+"건");
  if(n.flu)parts.push("인플루엔자 "+n.flu+"건");
  alert(parts.length ? "합쳤어요.\n\n더해진 것: "+parts.join(" · ") : "새로 더할 게 없었어요.\n이미 다 들어 있는 기록이에요.");
  bkTab="out"; go("home");
}
function bkRestore(){
  const d=bkParse(); if(!d) return;
  let n=0; try{ n=(d.logs||[]).length }catch(e){}
  if(!confirm("기록 "+n+"건짜리 백업이에요.\n지금 이 폰의 기록은 지워지고 이걸로 바뀝니다. 계속할까요?")) return;
  try{ applyBackup(d) }catch(e){ alert("되살리지 못했어요. 백업 글자가 온전한지 확인해 주세요."); return }
  alert("되살렸어요. 기록 "+logs.length+"건.");
  bkTab="out"; go("home");
}

/* ============ 예방접종 체크리스트 ============ */
function vaxDone(id){ return vax.rec[id]!==undefined }
function vaxDateOf(id){ const v=vax.rec[id]; return (typeof v==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(v))?v:"" }
function vaxTap(id){
  if(vaxDone(id)) delete vax.rec[id]; else vax.rec[id]=1;
  save(); render();
}
function vaxDate(id){
  const cur=vaxDateOf(id);
  const d=prompt("접종한 날짜를 적어주세요. (예: 2026-02-26)\n비워두면 날짜 없이 «맞음»으로만 남습니다.", cur);
  if(d===null) return;
  const t=d.trim();
  if(t===""){ vax.rec[id]=1 }
  else if(/^\d{4}-\d{2}-\d{2}$/.test(t)){ vax.rec[id]=t }
  else { alert("YYYY-MM-DD 형식으로 적어주세요. 예) 2026-02-26"); return }
  save(); render();
}
function fluAdd(){
  const d=prompt("인플루엔자를 맞은 날짜 (예: 2026-10-05)", todayStr());
  if(d===null) return; const t=d.trim();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(t)){ alert("YYYY-MM-DD 형식으로 적어주세요."); return }
  if(vax.flu.indexOf(t)<0) vax.flu.push(t);
  vax.flu.sort(); save(); render();
}
function fluDel(d){ vax.flu=vax.flu.filter(x=>x!==d); save(); render(); }
/* 지금 시기 = 아이 월령이 걸쳐 있는 그룹들 (겹칠 수 있음). 아직 시작 전이면 곧 올 시기 하나. */
function vaxGroupsNow(){
  const m=monthAge();
  let ks=VAX_G.filter(g=>m>=g[2]&&m<g[3]).map(g=>g[0]);
  if(!ks.length){ const nx=VAX_G.filter(g=>g[2]>m).sort((a,b)=>a[2]-b[2])[0]; if(nx)ks=[nx[0]] }
  if(!ks.length) ks=[VAX_G[VAX_G.length-1][0]];
  return ks;
}
function vaxRow(id,title,when,extra){
  const done=vaxDone(id), dt=vaxDateOf(id);
  const aria=esc((title+" "+when).replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim());
  return '<div class="vaxrow'+(done?" on":"")+'" role="checkbox" tabindex="0" aria-checked="'+(done?"true":"false")+'" aria-label="'+aria+'"'
   +' onclick="vaxTap(\''+id+'\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();vaxTap(\''+id+'\')}">'
   +'<span class="vaxbox" aria-hidden="true">'+(done?"✓":"")+'</span>'
   +'<span class="vaxnm">'+title+'<br><span class="vaxw">'+when+(extra||"")+'</span></span>'
   +(done?'<span class="vaxdt" onclick="event.stopPropagation();vaxDate(\''+id+'\')">'+(dt||"날짜 적기 ✎")+'</span>':'')
   +'</div>';
}

  const m=monthAge(), gNow=vaxGroupsNow();
  let h='<div class="fade"><button class="ghost" onclick="go(\'map\')">← 지도로</button>'
   +'<h2 class="hd">💉 예방접종 · 검진 체크</h2>'
   +'<div class="small" style="margin-bottom:10px">맞은 것에 체크만 하시면 돼요. 날짜는 안 적어도 됩니다. <b>지금 '+esc(child.name||"우리 아이")+'는 생후 '+m+'개월</b>이에요.</div>';

  /* 지금 시기 안내 */
  const gTitle=VAX_G.filter(g=>gNow.indexOf(g[0])>=0).map(g=>g[1]).join(" · ");
  const todo=[];
  VAX.forEach(vc=>vc.d.forEach((dd,i)=>{ if(gNow.indexOf(dd[2])>=0 && !vaxDone(vc.k+"_"+i)) todo.push(vc.n+" "+dd[0]) }));
  h+='<div class="card pop"><h3 style="margin-top:0">지금 시기 — 생후 '+m+'개월</h3>'
   +'<div class="small" style="margin-bottom:6px">표준일정에서 <b>'+gTitle+'</b> 칸에 해당해요.</div>'
   +(todo.length
      ? '<div style="font-size:13.5px;font-weight:700;line-height:1.6">아직 체크 안 된 것: '+esc(todo.join(" · "))+'</div>'
        +'<div class="small" style="margin-top:6px">이미 맞으셨다면 아래에서 체크해주세요. 아직이라면 병원에 물어보시면 됩니다.</div>'
      : '<div style="font-size:13.5px;font-weight:700">이 시기 것은 모두 체크돼 있어요.</div>')
   +'</div>';

  /* 시기별 접종 — 아이 월령에서 먼 시기(만 2세 이후)는 맨 아래에 하나로 접어둔다 */
  const later=[];
  VAX_G.forEach(g=>{
    const rows=[];
    VAX.forEach(vc=>vc.d.forEach((dd,i)=>{ if(dd[2]===g[0]) rows.push([vc,dd,i]) }));
    if(!rows.length) return;
    if(g[2]>=24 && m<12){ later.push([g,rows]); return }
    const done=rows.filter(r=>vaxDone(r[0].k+"_"+r[2])).length;
    const open=(g[2]<=m+3);
    h+='<details class="card vaxg"'+(open?" open":"")+'><summary>'+g[1]
     +(gNow.indexOf(g[0])>=0?' <span class="badge ok">지금 시기</span>':'')
     +'<span class="vaxcnt">기록 '+done+'/'+rows.length+'</span></summary>';
    rows.forEach(r=>{
      const vc=r[0], dd=r[1], i=r[2];
      h+=vaxRow(vc.k+"_"+i, esc(vc.n)+' <b>'+dd[0]+'</b>', esc(vc.v)+' · '+esc(dd[1]));
    });
    const notes=[...new Set(rows.map(r=>r[0].note).filter(Boolean))];
    notes.forEach(t=>{ h+='<div class="small" style="margin-top:8px">ℹ️ '+esc(t)+'</div>' });
    h+='</details>';
  });

  /* 인플루엔자 — 매년 */
  h+='<div class="card"><h3 style="margin-top:0">인플루엔자 — 매년</h3>'
   +'<div class="small" style="margin-bottom:8px">생후 6개월부터 해마다 맞습니다. 처음 맞는 해에는 4주 간격으로 2회예요. 맞은 날짜를 쌓아두시면 병원에서 확인하기 좋아요.</div>';
  if(vax.flu.length){
    vax.flu.forEach(d=>{ h+='<div style="display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;padding:6px 0;border-bottom:2px solid var(--line)"><span>✓ '+d+'</span><button class="ghost" onclick="fluDel(\''+d+'\')">지움</button></div>' });
  } else { h+='<div class="small">아직 기록이 없어요.</div>' }
  h+='<button class="ghost" onclick="fluAdd()">+ 맞은 날짜 추가</button></div>';

  /* 영유아 건강검진 */
  h+='<div class="card"><h3 style="margin-top:0">🩺 영유아 건강검진</h3>'
   +'<div class="small" style="margin-bottom:6px">국민건강보험공단이 지원하는 무료 검진이에요. 시기 안에 받으면 됩니다.</div>';
  CHK.forEach(c=>{
    const soon = (m>=c[3]-1);
    h+=vaxRow("chk_"+c[0], esc(c[1]), esc(c[2]), soon&&!vaxDone("chk_"+c[0])&&m<=c[3]+12?' · <b style="color:var(--ok)">지금 시기</b>':'');
  });
  h+='</div>';

  /* 나중에 — 만 2세 이후 */
  if(later.length){
    const tot=later.reduce((a,x)=>a+x[1].length,0);
    const dn=later.reduce((a,x)=>a+x[1].filter(r=>vaxDone(r[0].k+"_"+r[2])).length,0);
    h+='<details class="card vaxg"><summary>나중에 — 만 2세 이후<span class="vaxcnt">기록 '+dn+'/'+tot+'</span></summary>';
    later.forEach(x=>{
      h+='<div style="font-size:13px;font-weight:800;color:var(--sub);margin:12px 0 2px">'+x[0][1]+'</div>';
      x[1].forEach(r=>{ h+=vaxRow(r[0].k+"_"+r[2], esc(r[0].n)+' <b>'+r[1][0]+'</b>', esc(r[0].v)+' · '+esc(r[1][1])) });
    });
    h+='</details>';
  }

  h+='<div class="notice" style="font-size:12.5px">'+esc(VAX_SRC)+'</div>'
   +'<div class="small" style="margin-bottom:20px">이 화면은 <b>기록만</b> 합니다. 무엇을 언제 맞을지는 병원에서 정합니다. 접종 기록은 「예방접종도우미」 누리집에서도 조회할 수 있어요.</div>';
  return h+'</div>';
}

  +'<input type="file" id="impFile" accept=".json,.txt" style="display:none" onchange="importData(this)">'
  +'<div style="height:8px"></div><button class="sec" style="color:#7A3A36;background:var(--pink);box-shadow:0 4px 0 rgba(190,90,80,.3)" onclick="resetAll()">전체 초기화</button></div>';
  h+='<div class="card"><h2 class="hd" style="font-size:16px">화면</h2>'
  +'<div style="font-size:13.5px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:10px"><span>🌙 밤중 모드<br><span class="small">잠든 아기 옆에서 켜도 눈이 부시지 않게 어둡고 붉은 화면으로 바꿔요</span></span>'
  +'<button class="condbtn '+(night.mode!=="off"?'on':'')+'" style="margin:0;white-space:nowrap" onclick="cycleNight()">'+nightLabel()+'</button></div>'
  +'<div style="height:10px"></div>'
  +'<div style="font-size:13.5px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:10px"><span>🔎 글자 크게<br><span class="small">화면 전체를 조금 키워요. 새벽에 눈이 침침할 때</span></span>'
  +'<button class="condbtn '+(bigText?'on':'')+'" style="margin:0;white-space:nowrap" onclick="cycleBig()">'+(bigText?'켜짐':'꺼짐')+'</button></div>'
  +'</div>';
  h+='<div class="card"><h2 class="hd" style="font-size:16px">💬 불편한 점 알려주기</h2>'
  +'<div class="small" style="margin-bottom:8px">막힌 데를 알려주시면 그날 안에 고칩니다. 지금 보시던 화면과 판본이 같이 담겨서 찾기가 쉬워져요.</div>'
  +'<button class="sec" onclick="sendFeedback()">✍️ 한 줄 적어서 복사하기</button>'
  +'<a class="sec" style="display:block;text-align:center;text-decoration:none;margin-top:8px" href="https://open.kakao.com/o/gXlOOhLi" target="_blank" rel="noopener">💬 사용자 방 (카카오 오픈채팅)<br><span class="small">막힌 곳·바라는 것 — 편하게 말씀해주세요</span></a></div>';
  h+='<div class="card"><h2 class="hd" style="font-size:16px">📣 친구에게 알리기</h2>'
  +'<div class="small" style="margin-bottom:8px">카톡 대화방·오픈채팅에 앱 소개와 주소를 보낼 수 있어요.</div>'
  +'<button class="sec" onclick="appShare()">📣 공유하기</button></div>';
  h+='<div class="card"><h2 class="hd" style="font-size:16px">이 앱에 대해</h2><div style="font-size:13.5px;line-height:1.8;font-weight:600">'
  +'놀이 '+PLAYS.length+'개 중 '+PLAYS.filter(p=>p.src&&p.src.length).length+'개는 한 아기(2025년 12월생)의 <b>'+REC_DAYS+'일치 관찰 기록</b>에서 나왔어요(카드의 📍가 출처). 나머지 '+PLAYS.filter(p=>p.ref).length+'개는 기록이 못 채운 영역을 미국 CDC 공식 활동 팁으로 채운 것이고, 카드에 🔬로 표시돼요.<br><br>'
  +'이 앱이 하지 않는 것: 발달 점수, 또래 비교, 연속 기록 배지, 밀린 알림, 아기에게 보여주는 화면.<br><br>'
  +esc(DISCLAIMER)+'<br><br>'+esc(FOOD_DISCLAIMER)
  +'<br><br>출처: U.S. CDC "Learn the Signs. Act Early." · WHO Motor Development Study (2006) · 삼성서울병원 임상영양팀 이유식 안내 · 대한소아청소년과학회 육아정보 · WHO Complementary Feeding Guideline (2023) · AAP · 식약처 생선 안전섭취 가이드.</div></div>';
  return h+"</div>";
}
let _admTap=0,_admT=null;
function adminTap(){
  _admTap++; clearTimeout(_admT); _admT=setTimeout(()=>{_admTap=0},1600);
  if(_admTap>=5){ _admTap=0; const on=!store.get("admin"); store.set("admin",on); render();
    alert(on?"운영자 메뉴가 열렸어요 (쇼핑 링크 등록)":"운영자 메뉴를 숨겼어요"); }
}
function stSave(){
  child.name=$("#stName").value.trim()||"우리 아이";
  child.birth=$("#stBirth").value||child.birth;
  child.due=$("#stDue").value||null;
  const nd=$("#stDom").value;if(nd!==child.domain){child.domain=nd;domSad=0}
  save();go("home");
}
function savePartner(){
  const lines=$("#stPartner").value.split("\n").map(l=>l.trim()).filter(Boolean);
  const map={};let bad=0;
  lines.forEach(l=>{const i=l.indexOf("=");if(i<1){bad++;return}
    const k=l.slice(0,i).trim(),v=l.slice(i+1).trim();
    if(!/^https:\/\/(link\.coupang\.com|www\.coupang\.com)/.test(v)){bad++;return}
    map[k]=v});
  shop.partner=map;shop.on=Object.keys(map).length>0;save();
  alert("저장했어요. 등록 "+Object.keys(map).length+"건"+(bad?" (형식이 안 맞아 건너뜀 "+bad+"건)":""));render();
}
function exportData(){
  try{
    const blob=new Blob([backupJSON()],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download="고슴이_백업_"+todayStr()+".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    store.set("lastBackup",todayStr());
    setTimeout(()=>{ if(window.Capacitor) alert("파일이 저장되지 않았다면 「기록 옮기기」에서 글자로 복사해 두세요. 설치한 앱에서는 파일 저장이 막혀 있을 수 있어요.") },900);
  }catch(e){ alert("파일 저장이 안 되는 환경이에요. 「기록 옮기기」에서 글자로 복사해 주세요."); go("backup"); }
}
function importData(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{ applyBackup(JSON.parse(r.result));
    alert("불러왔어요. 기록 "+logs.length+"건.");go("home")}
   catch(e){alert("파일을 읽지 못했어요. 이 앱에서 내보낸 백업인지 확인해주세요.")}};
  r.readAsText(f);
}
function resetAll(){
  if(!confirm("모든 기록을 지우고 처음으로 돌아가요. 내보내기 백업은 하셨나요?"))return;
  child=null;logs=[];playLogs=[];playState={};miles={};sugCache={};domSad=0;
  feed={tried:{},watch:null,plan:{},stageOv:null};growth=[];appts=[];shop={partner:{},on:false};vax={rec:{},flu:[]};
  if(store.ok)Object.keys(localStorage).filter(k=>k.startsWith("siwoo.")).forEach(k=>localStorage.removeItem(k));
  store.mem={};ob={step:1,birth:"",due:"",preterm:false,domain:null,reason:null,name:""};
  go("onboard");
}

/* ============ 렌더 ============ */
function render(){
  applyNight();
  header();navSync();
  const m=$("#main");
  if(!child){view="onboard";m.innerHTML=vOnboard();navSync();return}
  switch(view){
    case"onboard":m.innerHTML=vOnboard();break;
    case"worry":m.innerHTML=vWorry();break;
    case"home":m.innerHTML=vHome();break;
    case"plays":m.innerHTML=vPlays();break;
    case"browse":m.innerHTML=vBrowse();break;
    case"card":m.innerHTML=vCard();break;
    case"feedback":m.innerHTML=vFeedback();break;
    case"food":m.innerHTML=vFood();break;
    case"foodSetup":m.innerHTML=vFoodSetup();break;
    case"foodDetail":m.innerHTML=vFoodDetail();break;
    case"planDay":m.innerHTML=vPlanDay();break;
    case"log":m.innerHTML=vLog();break;
    case"sleep":m.innerHTML=vSleep();break;
    case"er":m.innerHTML=vER();break;
    case"moon":m.innerHTML=vMoon();break;
    case"cal":logMode="cal";view="log";m.innerHTML=vLog();break;
    case"map":m.innerHTML=vMap();break;
    case"vax":m.innerHTML=vVax();break;
    case"backup":m.innerHTML=vBackup();break;
    case"summary":m.innerHTML=vSummary();break;
    case"settings":m.innerHTML=vSettings();break;
    default:m.innerHTML=vHome();
  }
}
/* 구버전(v3/v4)이 만든 식단 자동 이행 — 끼니 조합 로테이션이 없는 옛 형식이면 오늘부터 다시 생성 */
(function(){
  if(!child) return;
  const p=feed.plan&&feed.plan[todayStr()];
  if(p && p.stock===undefined && curStage().k!=="pre"){ buildMonth(todayStr()); render(); }
})();
applyBig();
render();
/* 오프라인에서도 열리게 — 웹(홈 화면에 추가)에서만. 설치한 앱은 파일을 이미 품고 있어서 필요 없다 */
if("serviceWorker" in navigator && location.protocol==="https:" && !window.Capacitor){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
